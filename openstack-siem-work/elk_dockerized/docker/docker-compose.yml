---
services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es01
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - bootstrap.memory_lock=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # Pins the JVM heap explicitly rather than relying on ES's default
      # ~50%-of-host-RAM auto-sizing -- see .env's ES_MEM_LIMIT/ES_JAVA_OPTS
      # comment for why (confirmed live: this was sizing to ~8.3GB heap
      # for well under 500MB of actual indexed data).
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ../elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
      - es01_data:/usr/share/elasticsearch/data
    ports:
      #      - "127.0.0.1:9000:${ES_PORT}"
      - "${ES_PORT}:${ES_PORT}"
    networks:
      - elastic
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q 'missing authentication credentials'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Service used to reset kibana_system password after elasticsearch startup
  init-password:
    image: curlimages/curl:7.85.0  # Use a lightweight image
    depends_on:
      es01:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        echo "Setting the kibana_system password...";
        until curl --cacert /certs/ca/ca.crt -X POST -u elastic:${ELASTIC_PASSWORD} -H "Content-Type: application/json" \
          "https://es01:9200/_security/user/kibana_system/_password" -d "{\"password\":\"${KIBANA_PASSWORD}\"}";
          do echo "Waiting for Elasticsearch to be ready...";
          sleep 5;
        done

        # If the loop exits, curl succeeded
        echo "Password set successfully for kibana_system.";

        # This is a single-node cluster -- a replica shard can never be
        # assigned to a second node, so the default number_of_replicas=1
        # on every honeypot-* index leaves the cluster permanently in
        # "yellow" status with unassigned shards for no benefit (no HA is
        # possible with one node anyway). Applies to indices created AFTER
        # this template exists; run once, idempotent (same template body
        # every time this service starts).
        echo "Setting number_of_replicas=0 for future honeypot-* indices...";
        curl --cacert /certs/ca/ca.crt -X PUT -u elastic:${ELASTIC_PASSWORD} -H "Content-Type: application/json" \
          "https://es01:9200/_index_template/honeypot-single-node" -d "{\"index_patterns\":[\"honeypot-*\"],\"template\":{\"settings\":{\"number_of_replicas\":0}},\"priority\":500}";
        echo "Index template applied.";
        exit 0;
      '
    volumes:
      - ../elasticsearch/certs/ca:/certs/ca:ro
    networks:
      - elastic
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    mem_limit: ${KIBANA_MEM_LIMIT}
    ports:
      - "${KIBANA_PORT}:${KIBANA_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -I --cacert config/certs/ca/ca.crt  https://kibana:5601 | grep -E \"HTTP/1\\.1 (200 OK|302 Found)\""
        ]
      interval: 10s
      timeout: 10s
      retries: 1200
    depends_on:
      es01:
        condition: service_healthy
      init-password:
        condition: service_completed_successfully
    volumes:
      - ../kibana/certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    networks:
      - elastic
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vector:
    image: timberio/vector:${VECTOR_VERSION}-debian
    container_name: vector
    environment:
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
    ports:
      - "0.0.0.0:${VECTOR_PORT}:${VECTOR_PORT}"
    # Was `wget -q -O - http://localhost:8686/health` -- the
    # timberio/vector:*-debian image has neither wget nor curl installed,
    # only the vector binary itself, so this failed every single run with
    # "exec: wget: executable file not found in PATH" (confirmed live via
    # `docker inspect vector` health log) despite Vector's own /health
    # endpoint responding correctly the whole time -- confirmed separately
    # by hitting it through bash's /dev/tcp, which IS available in this
    # image. Explicitly invoking `bash -c` (not CMD-SHELL, which runs via
    # /bin/sh -> dash in this image, and dash doesn't support /dev/tcp
    # either -- confirmed that failure too before landing on this).
    healthcheck:
      test:
        [
          "CMD", "bash", "-c",
          "exec 3<>/dev/tcp/localhost/8686 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    volumes:
      - ../vector/certs:/usr/share/vector/certs:ro
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ../vector/geoip/dbs/:/geoip
      - vector_data:/var/lib/vector
    networks:
      - elastic
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  es01_data:
    driver: local
  kibana_data:
    driver: local
  vector_data:
    driver: local

networks:
  elastic:
    driver: bridge
