# Filebeat configuration for shipping logs to ELK SIEM via Logstash
# This configuration collects Docker container, Suricata, Nginx, and Redis logs

filebeat.inputs:
  # Docker container logs from /var/lib/docker/containers/**/*.json
  - type: container
    enabled: true
    paths:
      - '/var/lib/docker/containers/*/*.log'
    # Filter by docker-compose project name
    condition: |
      equals.docker.container.labels.com.docker.compose.project: "${COMPOSE_PROJECT_NAME:honeypot-ids-system-v1}"
    json.keys_under_root: false
    json.add_error_key: true
    fields:
      log_type: docker
      environment: ${ENVIRONMENT:development}
      honeypot_system: containers
      compose_project: ${COMPOSE_PROJECT_NAME:honeypot-ids-system-v1}
    fields_under_root: true
    tags: ["docker", "container", "honeypot"]

  # Suricata EVE JSON logs
  - type: log
    enabled: true
    paths:
      - /var/log/suricata/eve.json
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      log_type: suricata
      environment: ${ENVIRONMENT:development}
      honeypot_system: ids
    fields_under_root: true
    tags: ["suricata", "ids", "honeypot"]

  # Suricata fast.log
  - type: log
    enabled: true
    paths:
      - /var/log/suricata/fast.log
    fields:
      log_type: suricata_fast
      environment: ${ENVIRONMENT:development}
      honeypot_system: ids
    fields_under_root: true
    tags: ["suricata", "fast", "honeypot"]

  # Nginx access logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      log_type: nginx_access
      environment: ${ENVIRONMENT:development}
      honeypot_system: reverse_proxy
    fields_under_root: true
    tags: ["nginx", "access", "honeypot"]

  # Nginx security logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/security.log
    fields:
      log_type: nginx_security
      environment: ${ENVIRONMENT:development}
      honeypot_system: reverse_proxy
    fields_under_root: true
    tags: ["nginx", "security", "honeypot", "critical"]

  # Nginx error logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      log_type: nginx_error
      environment: ${ENVIRONMENT:development}
      honeypot_system: reverse_proxy
    fields_under_root: true
    tags: ["nginx", "error", "honeypot"]

  # Redis logs (if available)
  - type: log
    enabled: true
    paths:
      - /var/log/redis/*.log
    ignore_older: 24h
    fields:
      log_type: redis
      environment: ${ENVIRONMENT:development}
      honeypot_system: session_store
    fields_under_root: true
    tags: ["redis", "session", "honeypot"]

# Processors to enrich data
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_source: true
      match_source_index: 4
      match_pids: ["process.pid", "process.parent.pid"]
  - add_kubernetes_metadata: ~

# Output to Logstash (on separate SIEM VM)
output.logstash:
  enabled: ${ELK_ENABLED:false}
  hosts: ["${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5044}"]

  # Load balancing and worker settings
  worker: 2
  loadbalance: true

  # Bulk and compression settings
  bulk_max_size: 2048
  compression_level: 3

  # Timeout settings
  timeout: 30

# Optional: Direct Elasticsearch output (for fallback or testing)
# Uncomment if you want to send directly to Elasticsearch
# output.elasticsearch:
#   enabled: false
#   hosts: ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
#   protocol: "${ELASTICSEARCH_PROTOCOL:https}"
#   username: "${ELASTICSEARCH_USER:}"
#   password: "${ELASTICSEARCH_PASSWORD:}"
#   index: "honeypot-ids-%{[agent.version]}-%{+yyyy.MM.dd}"
#   ssl.enabled: ${ELASTICSEARCH_SSL_ENABLED:true}
#   ssl.verification_mode: "${ELASTICSEARCH_SSL_VERIFY:certificate}"
#   ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]

# Setup template
setup.template.name: "honeypot-ids"
setup.template.pattern: "honeypot-ids-*"
setup.template.enabled: true
setup.template.overwrite: false

# Kibana configuration (optional for dashboard setup)
setup.kibana:
  enabled: ${ELK_ENABLED:false}
  host: "${KIBANA_HOST:localhost}:${KIBANA_PORT:5601}"
  protocol: "${KIBANA_PROTOCOL:https}"
  username: "${ELASTICSEARCH_USER:}"
  password: "${ELASTICSEARCH_PASSWORD:}"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644

# Monitoring (send Filebeat metrics to Elasticsearch)
monitoring.enabled: ${ELK_ENABLED:false}
monitoring.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
  username: "${ELASTICSEARCH_USER:}"
  password: "${ELASTICSEARCH_PASSWORD:}"

# HTTP endpoint for debugging
http.enabled: true
http.host: localhost
http.port: 5066
