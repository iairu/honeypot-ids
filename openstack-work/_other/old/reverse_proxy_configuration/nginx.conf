events {}

http {
    # Hide nginx version
    server_tokens off;

    # upstream production_eshop_upstream {
    #     server production_eshop:80 max_fails=0 fail_timeout=10s;
    # }
    # upstream honeypot_eshop_upstream {
    #     server honeypot_eshop:80 max_fails=0 fail_timeout=10s;
    # }

    server {
        listen 80;
        server_name openstack.local;

        # Access control
        allow 127.0.0.1; # Localhost
        allow 100.64.0.0/10; # Tailscale access
        allow 10.0.0.0/8; # Local network access
        allow 147.175.0.0/16; # STUBA
        deny all;

        client_max_body_size 128M;

        location / {
            proxy_pass http://production_eshop:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Enable WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header Access-Control-Allow-Origin *;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
