name: demo-resource-usage
# docker compose -f docker-compose.demo.yml up
services:
  # Production WordPress database
  production_database:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=demo_password
      - MYSQL_ROOT_PASSWORD=demo_password
    ports:
      - "3306:3306"
    networks:
      - demo_network

  # Production WordPress instance
  production_eshop:
    image: wordpress:6.8.3-php8.1
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=demo_password
    ports:
      - "8081:80"
    networks:
      - demo_network

  # Honeypot WordPress database
  honeypot_database:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=honeypot_database
      - MYSQL_USER=honeypot_user
      - MYSQL_PASSWORD=demo_password
      - MYSQL_ROOT_PASSWORD=demo_password
    ports:
      - "3307:3306"
    networks:
      - demo_network

  # Honeypot WordPress instance
  honeypot_eshop:
    image: wordpress:6.8.3-php8.1
    environment:
      - WORDPRESS_DB_HOST=honeypot_database:3306
      - WORDPRESS_DB_NAME=honeypot_database
      - WORDPRESS_DB_USER=honeypot_user
      - WORDPRESS_DB_PASSWORD=demo_password
    ports:
      - "8082:80"
    networks:
      - demo_network

  # Redis for session management
  session_store:
    image: redis:7-alpine
    command: redis-server --loglevel verbose
    ports:
      - "6379:6379"
    networks:
      - demo_network

  # Session management API service
  session_manager:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "echo 'const http = require(\"http\"); const server = http.createServer((req, res) => { console.log(\"Request received:\", req.method, req.url); res.writeHead(200); res.end(\"Session Manager Active\"); }); server.listen(3001, () => console.log(\"Session manager listening on port 3001\"));' > server.js && node server.js"
    ports:
      - "3001:3001"
    networks:
      - demo_network

  # Suricata IDS for traffic analysis
  suricata_ids:
    image: jasonish/suricata:latest
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - "514:514/udp"
    networks:
      - demo_network

  # Reverse proxy
  reverse_proxy:
    image: nginx:latest
    ports:
      - "8083:80"
      - "4433:443"
    networks:
      - demo_network

  # Traffic mirroring
  traffic_mirror:
    image: alpine/socat:latest
    command: sh -c "while true; do echo '[Traffic Mirror] Monitoring traffic...'; sleep 5; done"
    ports:
      - "9999:9999"
    networks:
      - demo_network

  # Log aggregator
  log_aggregator:
    image: fluent/fluent-bit:latest
    ports:
      - "24224:24224"
    networks:
      - demo_network

  # Threat intelligence updater
  threat_intel:
    image: python:3.11-alpine
    command: sh -c "python -c \"import time; import sys; [print(f'[Threat Intel] Updating threat database... iteration {i}', flush=True) or time.sleep(3) for i in range(1000)]\""
    networks:
      - demo_network

  # File synchronization service
  file_sync:
    image: alpine:latest
    command: sh -c "while true; do echo '[File Sync] Synchronizing files...'; sleep 4; done"
    networks:
      - demo_network

networks:
  demo_network:
    driver: bridge