input{
  beats {
    port 			=> 5044
    ssl 			=> true
    ssl_certificate 		=> "/usr/share/logstash/certs/logstash/logstash.crt"	# Logstash's certificate
    ssl_key 			=> "/usr/share/logstash/certs/logstash/logstash.key"	# Logstash's private key
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"] 	# CA certificate to verify Filebeat
    ssl_client_authentication 	=> "required"                  			# Enforces client certificate verification
    codec 			=> json
    }
}

filter {
  # Identify log type based on Filebeat fields
  if [docker][container][name] {
    mutate {
      add_field => { "log_type" => "docker" }
    }
  } else if [log][file][path] =~ /nginx/ {
    mutate {
      add_field => { "log_type" => "nginx" }
    }
  } else if [log][file][path] =~ /redis/ {
    mutate {
      add_field => { "log_type" => "redis" }
    }
  }

  # Parse Docker container logs
  if [log_type] == "docker" {
    # Docker logs are already in JSON format from /var/lib/docker/containers/**/*.json
    if [log] {
      json {
        source => "log"
        target => "docker_log"
      }
    }

    # Extract container info
    if [container][labels][com.docker.compose.service] {
      mutate {
        add_field => { "service_name" => "%{[container][labels][com.docker.compose.service]}" }
        add_field => { "compose_project" => "%{[container][labels][com.docker.compose.project]}" }
      }
    }
  }

  # Parse Nginx access logs
  if [log_type] == "nginx" and [log][file][path] =~ /access/ {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }

    if [clientip] {
      mutate {
        add_field => { "src_ip" => "%{clientip}" }
      }
    }
  }

  # Parse Nginx error logs
  if [log_type] == "nginx" and [log][file][path] =~ /error/ {
    grok {
      match => { "message" => "(?<timestamp>%{YEAR}[./-]%{MONTHNUM}[./-]%{MONTHDAY}[- ]%{TIME}) \[%{LOGLEVEL:severity}\] %{POSINT:pid}#%{NUMBER:threadid}\: \*%{NUMBER:connectionid} %{GREEDYDATA:errormessage}" }
    }
  }

  # Parse Redis logs
  if [log_type] == "redis" {
    grok {
      match => { "message" => "%{POSINT:pid}:%{CHAR:role} %{REDISTIMESTAMP:timestamp} %{GREEDYLOGLEVEL:severity} %{GREEDYDATA:redis_message}" }
    }
  }

  # DNS resolution and GeoIP enrichment for IP addresses
  if [src_ip] {
    mutate {
      add_field => { "src_hostname" => "%{src_ip}" }
    }

    # Perform DNS resolution on the new field src_hostname
    dns {
      reverse             => [ "src_hostname" ]
      nameserver          => [ "1.1.1.1", "8.8.8.8", "8.8.4.4" ]
      action              => "replace"
      hit_cache_size      => 4096
      hit_cache_ttl       => 900
      failed_cache_size   => 512
      failed_cache_ttl    => 900
    }

    if [src_hostname] =~ /^\b(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}\b$/ {
      mutate {
        remove_field => ["src_hostname"]
      }
    }

    ###################################
    ###### GEOIP DATA ENRICHMENT ######
    ###################################

    geoip {
      source 		=> "src_ip"
      database 		=> "/geoip/GeoLite2-City.mmdb"
      target		=> "source"
    }

    geoip {
      source 		=> "src_ip"
      database 		=> "/geoip/GeoLite2-ASN.mmdb"
      target		=> "source"
    }
  }

  #######################################
  ###### REMOVE UNNECESSARY FIELDS ######
  #######################################

  mutate {
    remove_field 	=> [
	"tags",
	"@version",
	"[ecs][version]",
	"[input][type]",
	"dst_ip",
	"dst_port",
	"[log][offset]",
	"[source][ip]"
    ]
  }
}


output {
  # Route logs to different indices based on log type
  if [log_type] == "docker" {
    elasticsearch {
      hosts               	=> ["${ELASTIC_HOSTS}"]
      index               	=> "honeypot-docker-logs-%{+YYYY.MM.dd}"
      user                	=> "${ELASTIC_USERNAME}"
      password            	=> "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
    }
  } else if [log_type] == "nginx" {
    elasticsearch {
      hosts               	=> ["${ELASTIC_HOSTS}"]
      index               	=> "honeypot-nginx-logs-%{+YYYY.MM.dd}"
      user                	=> "${ELASTIC_USERNAME}"
      password            	=> "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
    }
  } else if [log_type] == "redis" {
    elasticsearch {
      hosts               	=> ["${ELASTIC_HOSTS}"]
      index               	=> "honeypot-redis-logs-%{+YYYY.MM.dd}"
      user                	=> "${ELASTIC_USERNAME}"
      password            	=> "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
    }
  } else {
    elasticsearch {
      hosts               	=> ["${ELASTIC_HOSTS}"]
      index               	=> "honeypot-generic-logs-%{+YYYY.MM.dd}"
      user                	=> "${ELASTIC_USERNAME}"
      password            	=> "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
    }
  }
}
