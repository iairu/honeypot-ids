name: honeypot-ids-system-v1
services:
  # ---------------------------------------------------------------------------
  # Initialization service
  # ---------------------------------------------------------------------------
  # Copies production WordPress files and database data into each of the three
  # honeypot pool directories, then generates self-signed SSL certificates.
  #
  # POOLING NOTE:
  #   Pool 1 reuses the original honeypot_eshop_files / honeypot_database_data
  #   directories for backward compatibility.  Pools 2 and 3 use new sibling
  #   directories (honeypot_eshop_files_2/3, honeypot_database_data_2/3).
  #   All three pools start from an identical copy of the production data; they
  #   diverge as individual attackers interact with their assigned instance.
  # ---------------------------------------------------------------------------
  init_setup:
    image: alpine:latest
    volumes:
      - ./production_eshop_files:/source_files:ro
      - ./production_database_data:/source_db:ro
      # Pool 1 destinations (original paths kept for backward compat)
      - honeypot_eshop_files:/dest_files_1
      - honeypot_database_data:/dest_db_1
      # Pool 2 destinations
      - honeypot_eshop_files_2:/dest_files_2
      - honeypot_database_data_2:/dest_db_2
      # Pool 3 destinations
      - honeypot_eshop_files_3:/dest_files_3
      - honeypot_database_data_3:/dest_db_3
      # Production DB destination (named volume to avoid vmhgfs chown restriction)
      - production_mysql_data:/dest_prod_db
      - ./ssl_certificates:/ssl_certs
    command: |
      sh -c "
      set -x
      echo 'Starting initialization setup (honeynet pool mode)...'

      apk add --no-cache rsync openssl

      # -----------------------------------------------------------------------
      # Helper: idempotently SYNC source code files into a destination
      # directory. Runs on EVERY \`docker compose up\`, not just first
      # provisioning -- this is what keeps honeypot pool volumes from
      # silently drifting from production_eshop_files/ when files are
      # added/changed after the pools were first created (previously this
      # used a one-shot copy_files() that skipped entirely once the
      # destination had any content at all, so post-provisioning additions
      # -- e.g. a new theme or mu-plugin -- never propagated and had to be
      # \`docker cp\`'d in by hand).
      #
      # rsync -a with no --delete: this is a one-directional add/update from
      # source, not a mirror. Anything that exists ONLY in the destination
      # (attacker-uploaded webshells under wp-content/uploads, other
      # honeypot-side forensic artifacts left by a real session) is
      # deliberately left untouched -- syncing new production files must
      # never destroy evidence of what an attacker did to a pool.
      # -----------------------------------------------------------------------
      sync_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          echo \"Syncing \$$LABEL into \$$DST...\"
          rsync -a \"\$$SRC/\" \"\$$DST/\" || echo \"  Warning: rsync for \$$LABEL returned non-zero\"
          echo \"  Done: \$$LABEL\"
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      # -----------------------------------------------------------------------
      # Helper: copy source data into a destination directory ONCE, skipping
      # entirely if the destination is already populated. Used ONLY for
      # stateful database data directories, where re-syncing on every startup
      # would overwrite live, mutable database state (including a pool's own
      # divergent history) -- unlike code files, an always-resync policy is
      # actively wrong here, not just unnecessary.
      # -----------------------------------------------------------------------
      copy_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          if [ -n \"\$$(find \$$DST -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
            echo \"  Destination \$$DST already populated – skipping \$$LABEL copy\"
          else
            echo \"Copying \$$LABEL files to \$$DST...\"
            find \"\$$DST\" -mindepth 1 -delete 2>/dev/null || true
            tar -C \"\$$SRC\" -cf - . | tar -C \"\$$DST\" -xf - 2>/dev/null || echo \"  Warning: tar copy for \$$LABEL returned non-zero\"
            echo \"  Done: \$$LABEL\"
          fi
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      # -----------------------------------------------------------------------
      # Sync WordPress files for each pool instance.
      # After syncing, remove production-hardening.php from every honeypot
      # destination.  That mu-plugin disables XML-RPC, strips version strings,
      # and closes other attack vectors on the production instance.  Honeypot
      # instances MUST NOT have it: attackers need to see realistic fingerprints
      # and reach the intentionally vulnerable endpoints (including xmlrpc.php).
      # Since sync_files() re-copies from source every run, this rm -f must
      # also run every time (a prior run's removal doesn't stick otherwise).
      # -----------------------------------------------------------------------
      sync_files /source_files /dest_files_1 'honeypot pool-1 WordPress files'
      rm -f /dest_files_1/wp-content/mu-plugins/production-hardening.php
      echo '  Removed production-hardening.php from pool-1 (honeypot retains attack surface)'

      sync_files /source_files /dest_files_2 'honeypot pool-2 WordPress files'
      rm -f /dest_files_2/wp-content/mu-plugins/production-hardening.php
      echo '  Removed production-hardening.php from pool-2 (honeypot retains attack surface)'

      sync_files /source_files /dest_files_3 'honeypot pool-3 WordPress files'
      rm -f /dest_files_3/wp-content/mu-plugins/production-hardening.php
      echo '  Removed production-hardening.php from pool-3 (honeypot retains attack surface)'

      # -----------------------------------------------------------------------
      # Copy database data directory for each pool instance, ONCE (see
      # copy_files above). Each pool gets its own isolated MySQL data
      # directory so that attacker writes to one pool's database do not
      # affect the others. Also copy to production_mysql_data (named volume)
      # so that the production MySQL container can own it – vmhgfs bind
      # mounts reject chown at runtime.
      # -----------------------------------------------------------------------
      copy_files /source_db /dest_prod_db 'production database data'
      copy_files /source_db /dest_db_1 'honeypot pool-1 database data'
      copy_files /source_db /dest_db_2 'honeypot pool-2 database data'
      copy_files /source_db /dest_db_3 'honeypot pool-3 database data'

      # -----------------------------------------------------------------------
      # Generate self-signed SSL certificates (shared across all services)
      # -----------------------------------------------------------------------
      echo 'Generating SSL certificates...'

      if [ ! -f '/ssl_certs/server.crt' ] || [ ! -f '/ssl_certs/server.key' ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /ssl_certs/server.key -out /ssl_certs/server.crt \
          -subj '/C=US/ST=State/L=City/O=HoneypotOrg/CN=localhost'
        chmod 600 /ssl_certs/server.key
        chmod 644 /ssl_certs/server.crt
        echo 'SSL certificates generated successfully'
      else
        echo 'SSL certificates already exist, skipping generation'
      fi

      echo 'Initialization setup completed successfully'
      set +x
      "

  # ---------------------------------------------------------------------------
  # Database migration applier for honeypot pools
  # ---------------------------------------------------------------------------
  # Applies every SQL file in honeypot_database_migrations/ (in lexicographic
  # order) to ALL three pool databases.  Running migrations on all pools ensures
  # they stay schema-identical so pool_router.lua can assign any IP to any pool
  # without compatibility issues.
  #
  # Migration files included:
  #   01_clean-honeypot-data.sql  – replaces real data with dummy data
  #   02_pool_tracking.sql        – creates honeynet pooling metadata tables
  # ---------------------------------------------------------------------------
  honeypot_db_migration:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
      honeypot_database_1:
        condition: service_healthy
      honeypot_database_2:
        condition: service_healthy
      honeypot_database_3:
        condition: service_healthy
    volumes:
      - ./honeypot_database_migrations:/migrations:ro
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASSWORD_POOL_2=${MYSQL_PASSWORD_POOL_2}
      - MYSQL_PASSWORD_POOL_3=${MYSQL_PASSWORD_POOL_3}
    command: |
      bash -c "
      echo 'Waiting for all honeypot pool databases to settle...'
      sleep 5

      # -----------------------------------------------------------------------
      # Helper: rotate a pool's DB user password to its own pool-specific
      # value.  honeypot_database_N's data directory is a raw copy of
      # production_database_data made ONCE by init_setup (see that service's
      # copy_files comment) -- MySQL only applies MYSQL_USER/MYSQL_PASSWORD
      # env vars on a truly empty data directory, so a freshly-provisioned
      # pool still has the SAME credentials as production and every other
      # pool until this rotates it. Idempotent: if NEW_PASS already works,
      # nothing to do (a previous run already rotated it); otherwise falls
      # back to the shared/original MYSQL_PASSWORD to perform the rotation.
      # Without this, all pools share one password despite sitting on one
      # flat network that lets any pool reach any other pool's database over
      # TCP -- see the note on the honeypot_database_N block above and
      # openstack-work/testing/test_pool_isolation.sh.
      # -----------------------------------------------------------------------
      set_pool_password() {
        HOST=\$$1
        NEW_PASS=\$$2
        if mysql -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$NEW_PASS\" -e 'SELECT 1' >/dev/null 2>&1; then
          echo \"  \$$HOST already uses its pool-specific password\"
          return 0
        fi
        if mysql -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$MYSQL_PASSWORD\" -e \"ALTER USER '\$$MYSQL_USER'@'%' IDENTIFIED BY '\$$NEW_PASS'; FLUSH PRIVILEGES;\" 2>/dev/null; then
          echo \"  Rotated \$$HOST to its pool-specific password\"
        else
          echo \"  WARNING: could not set pool-specific password for \$$HOST (neither old nor new password worked)\"
        fi
      }

      set_pool_password honeypot_database_2 \"\$$MYSQL_PASSWORD_POOL_2\"
      set_pool_password honeypot_database_3 \"\$$MYSQL_PASSWORD_POOL_3\"

      # -----------------------------------------------------------------------
      # Helper: apply all migrations to a single database host. Each pool has
      # its own DB password (see set_pool_password above), so the password to
      # use is passed in per call, not read from a single shared MYSQL_PASSWORD.
      # Exits with status 1 if any migration fails so Docker marks the service
      # as failed and dependent services (honeypot_eshop_N) do not start.
      # -----------------------------------------------------------------------
      apply_migrations() {
        HOST=\$$1
        PASS=\$$2
        echo \"\"
        echo \"=== Applying migrations to \$$HOST ===\"

        if [ -d '/migrations' ] && [ -n \"\$$(find /migrations -name '*.sql' -type f)\" ]; then
          for migration in \$$(ls /migrations/*.sql | sort); do
            if [ -f \"\$$migration\" ]; then
              echo \"  Applying: \$$migration\"
              mysql -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$PASS\" \"\$$MYSQL_DATABASE\" --force < \"\$$migration\"
              if [ \$$? -eq 0 ]; then
                echo \"  [OK] \$$migration applied to \$$HOST\"
              else
                echo \"  [SKIP] \$$migration failed on \$$HOST (continuing)\"
              fi
            fi
          done
          echo \"=== All migrations applied to \$$HOST ===\"
        else
          echo \"  No migrations found in /migrations – skipping \$$HOST\"
        fi
      }

      # Apply to every pool database in turn, each with its own password.
      # Failures are fatal so that a honeypot pool is never started with
      # incomplete schema (which would expose real production data).
      apply_migrations honeypot_database_1 \"\$$MYSQL_PASSWORD\"
      apply_migrations honeypot_database_2 \"\$$MYSQL_PASSWORD_POOL_2\"
      apply_migrations honeypot_database_3 \"\$$MYSQL_PASSWORD_POOL_3\"

      echo ''
      echo 'All honeypot pool database migrations completed successfully.'
      "
    networks:
      - honeypot_network

  # ---------------------------------------------------------------------------
  # Honeypot content replication (periodic production -> honeypot pool sync)
  # ---------------------------------------------------------------------------
  # Long-running loop (see scripts/replicate_content_to_honeypot.sh) that
  # keeps each honeypot pool's pages/posts/products in sync with production
  # every REPLICATION_INTERVAL_SECONDS, so a pool never silently goes stale
  # after its one-time initial seed (init_setup/honeypot_db_migration above).
  # Strict allow-list of content tables only -- never touches wp_users or any
  # WooCommerce order/customer/payment table; see the script's header comment
  # for the full non-destructive apply strategy and the exploit-gating
  # coordination with pool_router.lua's is_pool_healthy().
  #
  # image: mysql:5.7 purely for its mysql/mysqldump client tools (same image
  # family as every other DB-touching service here); it never runs mysqld
  # itself. redis-cli isn't present on that image, so it's installed via yum
  # at container start (same "install what you need at startup" pattern
  # init_setup already uses with `apk add`), used to set/clear the
  # honeypot_pool_replicating:<N> flag pool_router.lua's failover consults.
  # ---------------------------------------------------------------------------
  honeypot_content_sync:
    image: mysql:5.7
    depends_on:
      honeypot_db_migration:
        condition: service_completed_successfully
      session_store:
        condition: service_healthy
    volumes:
      - ./scripts/replicate_content_to_honeypot.sh:/replicate_content_to_honeypot.sh:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASSWORD_POOL_2=${MYSQL_PASSWORD_POOL_2}
      - MYSQL_PASSWORD_POOL_3=${MYSQL_PASSWORD_POOL_3}
      - REDIS_HOST=session_store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REPLICATION_INTERVAL_SECONDS=${REPLICATION_INTERVAL_SECONDS:-300}
    command: >
      bash -c "
      yum install -y redis >/dev/null 2>&1 || echo 'WARNING: failed to install redis-cli via yum -- replication flag gating will be skipped this run';
      exec bash /replicate_content_to_honeypot.sh
      "
    restart: unless-stopped
    networks:
      - production_network
      - honeypot_network
      - session_network

  # Production WordPress database
  production_database:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - production_mysql_data:/var/lib/mysql
    networks:
      - production_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Production WordPress instance (clean, secure)
  production_eshop:
    image: wordpress:6.8.3-php8.1
    depends_on:
      production_database:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
    # ports:
    #   - "80:80" # temporary port for direct access
    volumes:
      - ./production_eshop_files:/var/www/html
    networks:
      - production_network
      - honeypot_network  # Added: Allow access to honeypot database for SQL routing
      - monitoring_network
    # -------------------------------------------------------------------------
    # Container hardening -- added this session. Every other service in this
    # compose file (honeypot_eshop_1/2/3, both database families,
    # backup_service) already had cap_drop/security_opt/resource limits;
    # production_eshop was the one exception, running with full default
    # Docker capabilities and no memory/CPU/pids ceiling at all. That's
    # backwards for a container serving real customer traffic and running a
    # large, third-party-plugin-heavy PHP application -- a compromise here
    # (a supply-chain issue in an installed plugin, a real unpatched CVE)
    # deserves the same containment as the honeypot side, and an unbounded
    # container can take down the whole host on its own even without being
    # compromised (a runaway request, a plugin bug).
    #
    # Same minimal capability set as honeypot_eshop_1 (Apache+PHP needs the
    # same things regardless of which side it's on); mem_limit/cpus set
    # higher than the honeypot pools (1024m/1.0 vs 512m/0.5) since this
    # instance is expected to carry real traffic and was already observed
    # comfortably using ~640MB unconstrained.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # WordPress writes (Font Library cache under wp-content/fonts, plugin/
    # theme auto-updates, wp-content/upgrade, debug.log, etc.) all happen
    # from apache WORKER processes running as www-data, not from the
    # container's root master process -- and confirmed live via
    # /proc/<worker-pid>/status that a plain setuid() to www-data drops
    # EVERY capability (CapEff 0000000000000000), including the
    # DAC_OVERRIDE granted above. That cap_add only ever helps things the
    # root master does; it can never bypass a permission check for
    # anything PHP itself writes.
    #
    # First attempt here was `chown -R www-data:www-data /var/www/html/
    # wp-content` -- WRONG for a bind mount: that chown doesn't stay
    # inside the container, it directly reassigns the HOST files (this is
    # ./production_eshop_files, a git-tracked directory) to uid/gid 33,
    # which on THIS host resolves to the unrelated system account `http`,
    # not the host user that owns the rest of the repo -- confirmed live,
    # broke `git add`/`git status` with "Permission denied" reading those
    # files from the host side afterward.
    #
    # Fixed the other way around instead: remap the CONTAINER's www-data
    # user/group to whatever uid/gid the bind mount is ALREADY owned by
    # (read via `stat` on the mount root itself, /var/www/html, which this
    # command never touches -- only wp-content underneath it gets
    # chowned), via usermod/groupmod, before apache ever starts. Apache
    # resolves its worker identity by NAME (`User www-data`, see
    # /etc/apache2/envvars) via getpwnam(), so remapping what uid that
    # name points to is enough -- no apache/wordpress config changes
    # needed. This means apache's workers end up running as the SAME
    # uid/gid that already owns the bind mount (the host user), so they
    # get write access via plain ownership with zero host-side ownership
    # change at all, and every file PHP creates going forward is owned by
    # that same uid too -- git keeps working indefinitely, not just once.
    # The one remaining chown (now a no-op / correctness net, not the
    # actual fix) re-claims anything still numerically owned by the OLD
    # www-data (33) from before this fix, or from a stale image layer.
    #
    # Left as the default ENTRYPOINT (docker-entrypoint.sh, unmodified --
    # still does its normal wp-config/DB-wait/core-file setup as root)
    # with only the final CMD replaced, so all of this runs after that
    # setup and before apache starts serving requests.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Honeypot pool databases (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool has its own MySQL instance backed by an independent data directory
  # so that attacker writes (SQL injections, data exfiltration, etc.) are
  # isolated per-pool and never affect other pools or production.
  #
  # All three use identical SCHEMA (enforced by migrations) so pool_router.lua
  # can assign any new IP to any pool interchangeably. Credentials, however,
  # are deliberately DIFFERENT per pool (MYSQL_PASSWORD / MYSQL_PASSWORD_POOL_2
  # / MYSQL_PASSWORD_POOL_3): all honeypot_eshop_N containers share one flat
  # honeypot_network and can reach every honeypot_database_N over TCP, so
  # without distinct credentials a compromised pool could authenticate
  # directly into another attacker's pool database. See
  # openstack-work/testing/test_pool_isolation.sh.
  # ---------------------------------------------------------------------------

  # Pool 1 – uses the original honeypot_database_data directory (backward compat)
  honeypot_database_1:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - honeypot_database_data:/var/lib/mysql
    networks:
      - honeypot_network
    # -------------------------------------------------------------------------
    # Container hardening – defence-in-depth so that a SQL injection or
    # database-level exploit cannot be used to pivot beyond this container.
    #
    # no-new-privileges: prevents setuid binaries from gaining additional
    #   capabilities at runtime (e.g. a SUID shell dropped by an attacker).
    # cap_drop ALL / cap_add minimal set: MySQL only needs CHOWN (own its data
    #   directory), DAC_OVERRIDE (read/write across uid boundaries),
    #   FOWNER (ignore ownership checks for its own files), SETGID/SETUID
    #   (drop to the 'mysql' user on start) and SYS_NICE (adjust scheduling
    #   priority via nice()).  All other Linux capabilities are removed.
    # mem_limit / cpus / pids_limit: prevent a runaway query (e.g. triggered by
    #   a time-based blind SQLi payload) from starving the host or other containers.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pool 2 – independent database instance
  honeypot_database_2:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_POOL_2}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - honeypot_database_data_2:/var/lib/mysql
    networks:
      - honeypot_network
    # Hardening – same rationale as honeypot_database_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD_POOL_2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pool 3 – independent database instance
  honeypot_database_3:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_POOL_3}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - honeypot_database_data_3:/var/lib/mysql
    networks:
      - honeypot_network
    # Hardening – same rationale as honeypot_database_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD_POOL_3}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Honeypot WordPress instances (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool runs a full WordPress+WooCommerce stack with the vulnerable plugins
  # installed.  They are intentionally identical at startup; divergence happens
  # as attackers interact with their assigned instance.
  #
  # IMPORTANT: honeypot_db_migration must complete before any eshop starts so
  # that dummy data is in place and no real customer data is ever served.
  #
  # Networks: each pool instance joins both honeypot_network (its own DB) and
  # production_network (for the SQL proxy routing feature) and monitoring_network.
  # ---------------------------------------------------------------------------

  # Pool 1 – uses the original honeypot_eshop_files directory (backward compat)
  honeypot_eshop_1:
    image: wordpress:6.8.3-php8.1
    depends_on:
      honeypot_database_1:
        condition: service_healthy
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_1:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
      # Pool identifier exposed to PHP code for logging / X-Honeypot-Pool header
      - HONEYPOT_POOL_ID=1
    # ports:
    #   - "8081:80" # temporary port for direct pool-1 access
    volumes:
      - honeypot_eshop_files:/var/www/html
    networks:
      - honeypot_network
      - production_network  # Allow access to production database for SQL routing
      - monitoring_network
    # -------------------------------------------------------------------------
    # Container hardening for honeypot WordPress instances.
    #
    # Goal: contain any attacker who achieves code execution (e.g. via RCE
    # through one of the intentionally vulnerable plugins) inside this single
    # container so they cannot pivot to the host or other containers.
    #
    # no-new-privileges: blocks privilege escalation via SUID/SGID binaries.
    #   An attacker who drops a SUID shell via an upload exploit cannot gain
    #   root with it.
    # cap_drop ALL / cap_add minimal: Apache+PHP only needs CHOWN, DAC_OVERRIDE,
    #   FOWNER (filesystem operations), SETGID/SETUID (drop to www-data) and
    #   NET_BIND_SERVICE (bind port 80).  KILL is added so Apache's parent
    #   process can terminate worker children.  All other capabilities
    #   (NET_RAW, SYS_ADMIN, SYS_PTRACE, etc.) are removed, preventing common
    #   container-escape techniques that rely on those capabilities.
    # mem_limit / cpus: prevents a resource-exhaustion DoS from one honeypot
    #   instance consuming all host resources (e.g. triggered by a fork-bomb
    #   or a CPU-intensive exploit payload).
    # pids_limit: caps the process tree so fork-bomb payloads cannot exhaust
    #   the host PID namespace.
    # Note: read_only is NOT set because WordPress/Apache must write to the
    #   filesystem (/tmp, wp-content/uploads, debug.log etc.).  The attacker's
    #   ability to write files is intentional — it is part of the honeypot's
    #   attack surface and is monitored via Suricata and ELK.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    # mem_limit/cpus bumped 512m/0.5 -> 1024m/1.0 this session: confirmed
    # live via `docker stats` that all three pools were sitting at
    # ~434-436MB *idle* against the old 512m cap (near-zero headroom) after
    # the new plugin roster (Wordfence, Elementor, etc. -- see README §3.4)
    # pushed the per-instance footprint up by several hundred MB. One pool
    # was observed pegged at 300%+ CPU and its own Docker healthcheck
    # timing out -- cgroup memory pressure thrashing, not an application
    # bug. Matches production_eshop's own newly-added ceiling (see that
    # service's comment) so honeypot pools aren't now the *more*
    # resource-starved side, which would undermine realism (an attacker
    # who fingerprints response latency shouldn't see the honeypot
    # struggling under routine load that production handles fine).
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # Same wp-content ownership fix as production_eshop above, same reason:
    # apache workers run as www-data and lose DAC_OVERRIDE (and every other
    # capability) on setuid(), so cap_add above can't help PHP's own
    # writes -- confirmed the same "Permission denied" write failure
    # reproduces here too (e.g. Font Library cache under wp-content/fonts)
    # once a font combination not already cached gets requested. This is a
    # named volume rather than production's bind mount, so a flat `chown
    # -R www-data:www-data` doesn't corrupt any host-tracked git files the
    # way it did there -- but it's remapped the same way regardless (see
    # production_eshop's comment for the full reasoning), both for
    # consistency and because this volume was itself seeded by an rsync
    # init step running as the host user, so it starts out owned by that
    # host uid/gid too, not www-data.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

