  # Suricata IDS for traffic analysis
  # ---------------------------------------------------------------------------
  # Runs in af-packet mode on the Docker bridge interface (eth0 inside the
  # container) so it can inspect all honeynet and production traffic that
  # passes through the monitoring_network.
  #
  # Capabilities:
  #   NET_ADMIN  – required for packet capture via AF_PACKET sockets
  #   SYS_NICE   – allows Suricata to adjust its scheduling priority
  #
  # The ids_network is a dedicated bridge used solely to give Suricata a
  # network attachment point with visibility into honeynet traffic.
  # ---------------------------------------------------------------------------
  suricata_ids:
    image: jasonish/suricata:latest
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - ./suricata_config:/etc/suricata
      - ./suricata_logs:/var/log/suricata
      - ./suricata_rules:/var/lib/suricata/rules
    environment:
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
    # network_mode: host -- NOT the usual `networks:` list. Confirmed live
    # (attack-test-2026-08-05.log, repo root) that plain bridge-network
    # *membership* (this container was on ids_network, same as
    # reverse_proxy) does not mean shared traffic *visibility*: each
    # container's virtual NIC only ever receives frames addressed to
    # itself, not a copy of everything else on the bridge. A full mixed
    # attack run against the stack produced zero http/alert events in
    # eve.json -- only background flow/stats noise on this container's own
    # otherwise-idle interface. Real client traffic reaches reverse_proxy
    # via published-port DNAT and its own backend traffic flows over
    # production_network/honeypot_network -- neither path ever touched
    # ids_network. Host networking gives this container the same view of
    # traffic as the Docker host itself (including the actual bridge
    # interfaces those other networks use), which is what
    # suricata_config/suricata.yaml's af-packet `interface: any` (see that
    # file) is written to capture across. `networks:` and `network_mode:`
    # are mutually exclusive in Compose, hence the removal below.
    network_mode: host
    # NET_ADMIN: required for AF_PACKET socket-based capture.
    # SYS_NICE: allows Suricata to manage its own thread scheduling priority.
    # privileged: required for AF_PACKET socket creation on some systems.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    cap_drop:
      - ALL
    # entrypoint override: the jasonish/suricata image's own
    # /docker-entrypoint.sh does `exec $@` (UNQUOTED) to pass through a
    # custom command. Since `command:` below is a single multi-line shell
    # script string, Compose passes it to that entrypoint as ONE argument --
    # but the unquoted `$@` in the image's entrypoint re-splits it on
    # whitespace/newlines, shredding the script into dozens of separate
    # arguments. `sh -c` then only sees the first fragment ("echo") as its
    # actual script; everything else silently becomes discarded positional
    # parameters. Net effect: the container ran essentially `sh -c echo`,
    # producing no real output and exiting in well under a second --
    # confirmed live: `docker compose ps -a` showed suricata_ids exiting
    # with code 0 immediately after every start, with completely empty logs
    # even for a trivial `echo` test command, and the same script worked
    # correctly the moment the image's entrypoint was bypassed. This is a
    # bug in the upstream image, not this project's script. Fixed by
    # overriding the entrypoint so our command reaches `sh -c` directly,
    # without going through the image's broken passthrough logic at all.
    #
    # `command` MUST be a YAML list with exactly one element (the script, as
    # a single block-scalar string) rather than a bare multi-line scalar.
    # A bare scalar is parsed by Compose in "shell form" and gets
    # shell-word-split into a *separate* array element per token before
    # being appended after the exec-form `entrypoint` -- so `/bin/sh -c`
    # ended up receiving "echo" as its `-c` script and every other word as a
    # discarded positional parameter, reproducing the exact same
    # word-splitting corruption this override was meant to fix, just one
    # layer up (in Compose's own command parsing instead of the image
    # entrypoint's). Wrapping it as a one-item list forces Compose to treat
    # the whole block as a single opaque string.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Starting Suricata IDS...'

        # Ensure log directory exists and is writable
        mkdir -p /var/log/suricata

        # Copy custom rules into the rules directory Suricata expects.
        # The local.rules file is mounted at /var/lib/suricata/rules/local.rules
        # which matches the rule-files path in suricata.yaml.
        if [ -f /var/lib/suricata/rules/local.rules ]; then
          echo '  Custom rules found at /var/lib/suricata/rules/local.rules'
        else
          echo '  Warning: local.rules not found - Suricata will use built-in rules only'
        fi

        # Start Suricata in AF_PACKET mode, in the FOREGROUND (no -D/daemonize)
        # so the suricata process itself is the container's main process --
        # this also removes the need for a separate `tail -f /dev/null`
        # keep-alive trick, whose behavior with BusyBox's tail implementation
        # on /dev/null was never actually verified to block indefinitely on
        # this image's base OS.
        #
        # `--pcap` is used bare (no interface value), reading the capture
        # config from suricata_config/suricata.yaml's `pcap:` section
        # instead (interface: any) -- see that file's comment for why PCAP
        # capture mode was chosen over AF_PACKET (AF_PACKET has no working
        # equivalent of libpcap's "any" pseudo-device, and this container's
        # network_mode: host setup means the real interface to listen on is
        # one of several dynamically-named, unpredictable docker bridge
        # interfaces rather than a single fixed name).
        #
        # Note for posterity: an earlier version of this line used
        # `--af-packet eth0` (space-separated), which is invalid CLI syntax
        # -- Suricata's real syntax is `--af-packet[=<dev>]`, requiring an
        # *equals sign* to attach an interface value. The space-separated
        # form gets parsed as two separate arguments, and the bare "eth0"
        # is then treated as an ad-hoc BPF filter expression to compile,
        # producing `failed to compile BPF "eth0": can't parse filter
        # expression: syntax error`. Confirmed live, and confirmed via
        # `suricata --help`. The same equals-sign requirement applies to
        # `--pcap[=<dev>]` -- passing a bare flag (no value at all, as done
        # here) sidesteps the whole issue by deferring entirely to the
        # config file, which is also the more maintainable form regardless.
        exec suricata -c /etc/suricata/suricata.yaml --pcap -l /var/log/suricata
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/suricata/fast.log"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Vector for shipping logs to ELK SIEM (on OpenStack SIEM VM 147.175.151.193)
  # ---------------------------------------------------------------------------
  # Automated backup service
  # ---------------------------------------------------------------------------
  # Runs on a 24-hour loop, dumping the production MySQL database and archiving
  # the production WordPress files into the ./backups/ directory on the host.
  #
  # Retention: the backup script keeps only the last 7 daily archives; older
  # files are pruned automatically to prevent unbounded disk growth.
  #
  # The service is intentionally isolated from honeypot networks and has no
  # access to honeypot data – backups are production-only.
  #
  # Security hardening: runs with no-new-privileges, drops all capabilities
  # (a backup process needs only filesystem read access, not Linux capabilities),
  # and is limited in memory and CPU to avoid interfering with live traffic.
  # ---------------------------------------------------------------------------
  backup_service:
    image: alpine:latest
    depends_on:
      production_database:
        condition: service_healthy
      production_eshop:
        condition: service_healthy
    volumes:
      - ./production_eshop_files:/source_wp:ro
      - ./backups:/backups
      - ./backups/backup.sh:/backup.sh:ro
      - ./backups/restore_db.sh:/restore_db.sh:ro
    networks:
      - production_network
    environment:
      - MYSQL_HOST=production_database
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - BACKUP_RETENTION_DAYS=7
    command: |
      sh -c "
        apk add --no-cache mysql-client > /dev/null 2>&1
        echo 'Backup service started. First backup in 5 minutes...'
        sleep 300
        while true; do
          /backup.sh
          echo 'Next backup in 24 hours...'
          sleep 86400
        done
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # DAC_OVERRIDE: ./backups/ is a host bind mount owned by the host user
    # (not root), and this container otherwise runs as root (the alpine
    # base image's default) with every other capability dropped. Without
    # DAC_OVERRIDE, root inside the container can no longer bypass a
    # directory's Unix permission bits -- confirmed live: backup.sh's very
    # first `mkdir "${DB_BACKUP_DIR}"` failed with "Permission denied" every
    # single run, so backup_service had been running for hours without ever
    # producing one actual backup file, silently. This is the one
    # capability that specifically restores "root can write into a
    # directory it doesn't own", which is exactly what's needed here and
    # nothing more.
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 50
    restart: unless-stopped

  vector:
    image: timberio/vector:0.43.0-debian
    profiles:
      - elk
    user: root
    depends_on:
      reverse_proxy:
        condition: service_started
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector/certs:/etc/vector/certs:ro
      - ./suricata_logs:/var/log/suricata:ro
      - ./nginx_logs:/var/log/nginx:ro
      - ./vector/data:/var/lib/vector
      - ./vector/logs:/var/log/vector
      # Docker socket and container logs for monitoring all containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Redis logs (if available) – named volume (vmhgfs bind-mount does not support chown)
      - redis_data:/var/log/redis:ro
    environment:
      - ELK_ENABLED=${ELK_ENABLED:-true}
      - VECTOR_HOST=${VECTOR_HOST:-147.175.151.193}
      - VECTOR_PORT=${VECTOR_PORT:-6000}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-147.175.151.193}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_ENABLED=${ELASTICSEARCH_SSL_ENABLED:-true}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - KIBANA_HOST=${KIBANA_HOST:-147.175.151.193}
      - KIBANA_PORT=${KIBANA_PORT:-5601}
      - KIBANA_PROTOCOL=${KIBANA_PROTOCOL:-https}
      - KIBANA_SSL_ENABLED=${KIBANA_SSL_ENABLED:-true}
      - KIBANA_SSL_VERIFY=${KIBANA_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}
    networks:
      - monitoring_network
    # Lets this container resolve "host.docker.internal" to the Docker
    # host's own gateway IP (Docker Engine 20.10+; Docker Desktop has this
    # built in, native Linux Engine needs it declared explicitly). This is
    # what makes single-host testing/development work: this project and
    # openstack-siem-work/elk_dockerized are two INDEPENDENT compose
    # projects with no shared network, by design (see README's two-host
    # split note) -- but the SIEM's vector aggregator already publishes its
    # port to 0.0.0.0 on the host, so setting VECTOR_HOST=host.docker.internal
    # (instead of the real remote SIEM VM's IP) reaches it without needing
    # any change to the SIEM stack's own network topology or joining the
    # two projects onto a shared network. Harmless in the real two-host
    # deployment: VECTOR_HOST there is still the real remote IP, and an
    # unused DNS alias doesn't affect anything.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: --config /etc/vector/vector.yaml
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Enhanced reverse proxy with Lua-based honeynet routing
  # ---------------------------------------------------------------------------
  # Waits for ALL three honeypot pool instances to be healthy before accepting
  # traffic so that pool_router.lua never routes to a pool that is still starting.
  # ---------------------------------------------------------------------------
  reverse_proxy:
    build:
      context: ./reverse_proxy_enhanced
      dockerfile: Dockerfile
    depends_on:
      production_eshop:
        condition: service_healthy
      honeypot_eshop_1:
        condition: service_healthy
      honeypot_eshop_2:
        condition: service_healthy
      honeypot_eshop_3:
        condition: service_healthy
      session_store:
        condition: service_healthy
      # DEAD CODE: session_manager was never implemented; dependency kept as
      # a commented placeholder in case a future session manager service is added.
      #session_manager:
      #  condition: service_healthy
      # suricata_ids is optional - it can run but doesn't block other services
      # suricata_ids:
      #   condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse_proxy_enhanced:/etc/nginx
      - ./ssl_certificates:/etc/ssl/certs:ro
      - ./nginx_logs:/var/log/nginx
      # Read access to Suricata's eve.json -- init_worker.lua's
      # parse_suricata_logs() tails this to feed threat_intel.threat_ips
      # (see suricata_rules.lua). This mount was missing entirely before:
      # the parser's io.open() silently returned nil every 30s (no log
      # line either way, since a genuinely-absent file and "nothing new to
      # process" look the same to that code path) -- Suricata alerts have
      # never actually reached router.lua's IP-reputation gate, regardless
      # of the eve.json-vs-fast.log parsing format. suricata_ids is not a
      # hard startup dependency (commented out above) so this may not
      # exist for the first few seconds after a fresh `docker compose up`;
      # parse_suricata_logs() already tolerates that (io.open returns nil,
      # skipped, tried again next timer tick).
      - ./suricata_logs:/var/log/suricata:ro
    networks:
      - production_network
      - honeypot_network
      - session_network
      - monitoring_network
      - ids_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSEIPDB_CONFIDENCE_MINIMUM=${ABUSEIPDB_CONFIDENCE_MINIMUM:-90}
      - ABUSEIPDB_DAILY_CHECK_LIMIT=${ABUSEIPDB_DAILY_CHECK_LIMIT:-1000}
      - ABUSEIPDB_BLACKLIST_ENABLED=${ABUSEIPDB_BLACKLIST_ENABLED:-false}
      - ABUSEIPDB_BLACKLIST_REFRESH_HOURS=${ABUSEIPDB_BLACKLIST_REFRESH_HOURS:-24}
      - INTERNAL_TEST_SECRET=${INTERNAL_TEST_SECRET:-}
      # - SESSION_MANAGER_URL=http://session_manager:3001
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

