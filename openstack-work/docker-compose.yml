name: honeypot-ids-system-v1
services:
  # ---------------------------------------------------------------------------
  # Initialization service
  # ---------------------------------------------------------------------------
  # Copies production WordPress files and database data into each of the three
  # honeypot pool directories, then generates self-signed SSL certificates.
  #
  # POOLING NOTE:
  #   Pool 1 reuses the original honeypot_eshop_files / honeypot_database_data
  #   directories for backward compatibility.  Pools 2 and 3 use new sibling
  #   directories (honeypot_eshop_files_2/3, honeypot_database_data_2/3).
  #   All three pools start from an identical copy of the production data; they
  #   diverge as individual attackers interact with their assigned instance.
  # ---------------------------------------------------------------------------
  init_setup:
    image: alpine:latest
    volumes:
      - ./production_eshop_files:/source_files:ro
      - ./production_database_data:/source_db:ro
      # Pool 1 destinations (original paths kept for backward compat)
      - ./honeypot_eshop_files:/dest_files_1
      - ./honeypot_database_data:/dest_db_1
      # Pool 2 destinations
      - ./honeypot_eshop_files_2:/dest_files_2
      - ./honeypot_database_data_2:/dest_db_2
      # Pool 3 destinations
      - ./honeypot_eshop_files_3:/dest_files_3
      - ./honeypot_database_data_3:/dest_db_3
      - ./ssl_certificates:/ssl_certs
    command: |
      sh -c "
      set -x
      echo 'Starting initialization setup (honeynet pool mode)...'

      # -----------------------------------------------------------------------
      # Helper: copy source files into a destination directory.
      # Skips silently if the source is empty so a fresh checkout does not fail.
      # -----------------------------------------------------------------------
      copy_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          echo \"Copying \$$LABEL files to \$$DST...\"
          find \"\$$DST\" -mindepth 1 -delete 2>/dev/null || true
          cp -a \"\$$SRC/\". \"\$$DST/\" 2>/dev/null || echo \"  Warning: copy for \$$LABEL returned non-zero\"
          echo \"  Done: \$$LABEL\"
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      # -----------------------------------------------------------------------
      # Copy WordPress files for each pool instance.
      # After copying, remove production-hardening.php from every honeypot
      # destination.  That mu-plugin disables XML-RPC, strips version strings,
      # and closes other attack vectors on the production instance.  Honeypot
      # instances MUST NOT have it: attackers need to see realistic fingerprints
      # and reach the intentionally vulnerable endpoints (including xmlrpc.php).
      # -----------------------------------------------------------------------
      copy_files /source_files /dest_files_1 'honeypot pool-1 WordPress files'
      rm -f /dest_files_1/wp-content/mu-plugins/production-hardening.php \
        && echo '  Removed production-hardening.php from pool-1 (honeypot retains attack surface)' \
        || echo '  Note: production-hardening.php not present in pool-1 destination (OK)'

      copy_files /source_files /dest_files_2 'honeypot pool-2 WordPress files'
      rm -f /dest_files_2/wp-content/mu-plugins/production-hardening.php \
        && echo '  Removed production-hardening.php from pool-2 (honeypot retains attack surface)' \
        || echo '  Note: production-hardening.php not present in pool-2 destination (OK)'

      copy_files /source_files /dest_files_3 'honeypot pool-3 WordPress files'
      rm -f /dest_files_3/wp-content/mu-plugins/production-hardening.php \
        && echo '  Removed production-hardening.php from pool-3 (honeypot retains attack surface)' \
        || echo '  Note: production-hardening.php not present in pool-3 destination (OK)'

      # -----------------------------------------------------------------------
      # Copy database data directory for each pool instance.
      # Each pool gets its own isolated MySQL data directory so that attacker
      # writes to one pool's database do not affect the others.
      # -----------------------------------------------------------------------
      copy_files /source_db /dest_db_1 'honeypot pool-1 database data'
      copy_files /source_db /dest_db_2 'honeypot pool-2 database data'
      copy_files /source_db /dest_db_3 'honeypot pool-3 database data'

      # -----------------------------------------------------------------------
      # Generate self-signed SSL certificates (shared across all services)
      # -----------------------------------------------------------------------
      echo 'Generating SSL certificates...'
      apk add --no-cache openssl

      if [ ! -f '/ssl_certs/server.crt' ] || [ ! -f '/ssl_certs/server.key' ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /ssl_certs/server.key -out /ssl_certs/server.crt \
          -subj '/C=US/ST=State/L=City/O=HoneypotOrg/CN=localhost'
        chmod 600 /ssl_certs/server.key
        chmod 644 /ssl_certs/server.crt
        echo 'SSL certificates generated successfully'
      else
        echo 'SSL certificates already exist, skipping generation'
      fi

      echo 'Initialization setup completed successfully'
      set +x
      "

  # ---------------------------------------------------------------------------
  # Database migration applier for honeypot pools
  # ---------------------------------------------------------------------------
  # Applies every SQL file in honeypot_database_migrations/ (in lexicographic
  # order) to ALL three pool databases.  Running migrations on all pools ensures
  # they stay schema-identical so pool_router.lua can assign any IP to any pool
  # without compatibility issues.
  #
  # Migration files included:
  #   01_clean-honeypot-data.sql  – replaces real data with dummy data
  #   02_pool_tracking.sql        – creates honeynet pooling metadata tables
  # ---------------------------------------------------------------------------
  honeypot_db_migration:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
      honeypot_database_1:
        condition: service_healthy
      honeypot_database_2:
        condition: service_healthy
      honeypot_database_3:
        condition: service_healthy
    volumes:
      - ./honeypot_database_migrations:/migrations:ro
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: |
      bash -c "
      echo 'Waiting for all honeypot pool databases to settle...'
      sleep 5

      # -----------------------------------------------------------------------
      # Helper: apply all migrations to a single database host.
      # Exits with status 1 if any migration fails so Docker marks the service
      # as failed and dependent services (honeypot_eshop_N) do not start.
      # -----------------------------------------------------------------------
      apply_migrations() {
        HOST=\$$1
        echo \"\"
        echo \"=== Applying migrations to \$$HOST ===\"

        if [ -d '/migrations' ] && [ -n \"\$$(find /migrations -name '*.sql' -type f)\" ]; then
          for migration in \$$(ls /migrations/*.sql | sort); do
            if [ -f \"\$$migration\" ]; then
              echo \"  Applying: \$$migration\"
              mysql -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$MYSQL_PASSWORD\" \"\$$MYSQL_DATABASE\" < \"\$$migration\"
              if [ \$$? -eq 0 ]; then
                echo \"  ✓ \$$migration applied to \$$HOST\"
              else
                echo \"  ✗ \$$migration FAILED on \$$HOST\"
                exit 1
              fi
            fi
          done
          echo \"=== All migrations applied to \$$HOST ===\"
        else
          echo \"  No migrations found in /migrations – skipping \$$HOST\"
        fi
      }

      # Apply to every pool database in turn.
      # Failures are fatal so that a honeypot pool is never started with
      # incomplete schema (which would expose real production data).
      apply_migrations honeypot_database_1
      apply_migrations honeypot_database_2
      apply_migrations honeypot_database_3

      echo ''
      echo 'All honeypot pool database migrations completed successfully.'
      "
    networks:
      - honeypot_network

  # Production WordPress database
  production_database:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./production_database_data:/var/lib/mysql
    networks:
      - production_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Production WordPress instance (clean, secure)
  production_eshop:
    image: wordpress:6.8.3-php8.1
    depends_on:
      production_database:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
    # ports:
    #   - "80:80" # temporary port for direct access
    volumes:
      - ./production_eshop_files:/var/www/html
    networks:
      - production_network
      - honeypot_network  # Added: Allow access to honeypot database for SQL routing
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Honeypot pool databases (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool has its own MySQL instance backed by an independent data directory
  # so that attacker writes (SQL injections, data exfiltration, etc.) are
  # isolated per-pool and never affect other pools or production.
  #
  # All three use identical credentials and schema (enforced by migrations) so
  # pool_router.lua can assign any new IP to any pool interchangeably.
  # ---------------------------------------------------------------------------

  # Pool 1 – uses the original honeypot_database_data directory (backward compat)
  honeypot_database_1:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./honeypot_database_data:/var/lib/mysql
    networks:
      - honeypot_network
    # -------------------------------------------------------------------------
    # Container hardening – defence-in-depth so that a SQL injection or
    # database-level exploit cannot be used to pivot beyond this container.
    #
    # no-new-privileges: prevents setuid binaries from gaining additional
    #   capabilities at runtime (e.g. a SUID shell dropped by an attacker).
    # cap_drop ALL / cap_add minimal set: MySQL only needs CHOWN (own its data
    #   directory), DAC_OVERRIDE (read/write across uid boundaries),
    #   FOWNER (ignore ownership checks for its own files), SETGID/SETUID
    #   (drop to the 'mysql' user on start) and SYS_NICE (adjust scheduling
    #   priority via nice()).  All other Linux capabilities are removed.
    # mem_limit / cpus / pids_limit: prevent a runaway query (e.g. triggered by
    #   a time-based blind SQLi payload) from starving the host or other containers.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pool 2 – independent database instance
  honeypot_database_2:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./honeypot_database_data_2:/var/lib/mysql
    networks:
      - honeypot_network
    # Hardening – same rationale as honeypot_database_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pool 3 – independent database instance
  honeypot_database_3:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./honeypot_database_data_3:/var/lib/mysql
    networks:
      - honeypot_network
    # Hardening – same rationale as honeypot_database_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Honeypot WordPress instances (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool runs a full WordPress+WooCommerce stack with the vulnerable plugins
  # installed.  They are intentionally identical at startup; divergence happens
  # as attackers interact with their assigned instance.
  #
  # IMPORTANT: honeypot_db_migration must complete before any eshop starts so
  # that dummy data is in place and no real customer data is ever served.
  #
  # Networks: each pool instance joins both honeypot_network (its own DB) and
  # production_network (for the SQL proxy routing feature) and monitoring_network.
  # ---------------------------------------------------------------------------

  # Pool 1 – uses the original honeypot_eshop_files directory (backward compat)
  honeypot_eshop_1:
    image: wordpress:6.8.3-php8.1
    depends_on:
      honeypot_database_1:
        condition: service_healthy
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_1:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
      # Pool identifier exposed to PHP code for logging / X-Honeypot-Pool header
      - HONEYPOT_POOL_ID=1
    # ports:
    #   - "8081:80" # temporary port for direct pool-1 access
    volumes:
      - ./honeypot_eshop_files:/var/www/html
    networks:
      - honeypot_network
      - production_network  # Allow access to production database for SQL routing
      - monitoring_network
    # -------------------------------------------------------------------------
    # Container hardening for honeypot WordPress instances.
    #
    # Goal: contain any attacker who achieves code execution (e.g. via RCE
    # through one of the intentionally vulnerable plugins) inside this single
    # container so they cannot pivot to the host or other containers.
    #
    # no-new-privileges: blocks privilege escalation via SUID/SGID binaries.
    #   An attacker who drops a SUID shell via an upload exploit cannot gain
    #   root with it.
    # cap_drop ALL / cap_add minimal: Apache+PHP only needs CHOWN, DAC_OVERRIDE,
    #   FOWNER (filesystem operations), SETGID/SETUID (drop to www-data) and
    #   NET_BIND_SERVICE (bind port 80).  KILL is added so Apache's parent
    #   process can terminate worker children.  All other capabilities
    #   (NET_RAW, SYS_ADMIN, SYS_PTRACE, etc.) are removed, preventing common
    #   container-escape techniques that rely on those capabilities.
    # mem_limit / cpus: prevents a resource-exhaustion DoS from one honeypot
    #   instance consuming all host resources (e.g. triggered by a fork-bomb
    #   or a CPU-intensive exploit payload).
    # pids_limit: caps the process tree so fork-bomb payloads cannot exhaust
    #   the host PID namespace.
    # Note: read_only is NOT set because WordPress/Apache must write to the
    #   filesystem (/tmp, wp-content/uploads, debug.log etc.).  The attacker's
    #   ability to write files is intentional — it is part of the honeypot's
    #   attack surface and is monitored via Suricata and ELK.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pool 2 – isolated WordPress instance
  honeypot_eshop_2:
    image: wordpress:6.8.3-php8.1
    depends_on:
      honeypot_database_2:
        condition: service_healthy
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_2:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
      - HONEYPOT_POOL_ID=2
    # ports:
    #   - "8082:80" # temporary port for direct pool-2 access
    volumes:
      - ./honeypot_eshop_files_2:/var/www/html
    networks:
      - honeypot_network
      - production_network
      - monitoring_network
    # Hardening – same rationale as honeypot_eshop_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pool 3 – isolated WordPress instance
  honeypot_eshop_3:
    image: wordpress:6.8.3-php8.1
    depends_on:
      honeypot_database_3:
        condition: service_healthy
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_3:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
      - HONEYPOT_POOL_ID=3
    # ports:
    #   - "8083:80" # temporary port for direct pool-3 access
    volumes:
      - ./honeypot_eshop_files_3:/var/www/html
    networks:
      - honeypot_network
      - production_network
      - monitoring_network
    # Hardening – same rationale as honeypot_eshop_1 above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for session management and threat intelligence
  session_store:
    image: redis:7-alpine
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - ./redis_data:/data
      - ./redis_config:/usr/local/etc/redis
    networks:
      - session_network
    command: |
      sh -c "
      echo 'Starting Redis with fresh data...'
      rm -rf /data/*
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
      "
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Suricata IDS for traffic analysis
  #suricata_ids:
  #  image: jasonish/suricata:latest
  #  depends_on:
  #    init_setup:
  #      condition: service_completed_successfully
  #  volumes:
  #    - ./suricata_config:/etc/suricata
  #    - ./suricata_logs:/var/log/suricata
  #    - ./suricata_rules:/var/lib/suricata/rules
  #  environment:
  #    - SURICATA_INTERFACE=eth0
  #    - ELK_ENABLED=${ELK_ENABLED:-false}
  #    - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
  #    - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
  #    - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
  #    - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
  #  networks:
  #    - monitoring_network
  #    - ids_network
  #  cap_add:
  #    - NET_ADMIN
  #    - SYS_ADMIN
  #  command: |
  #    sh -c "
  #      echo 'Starting Suricata IDS...'
#
  #      # Ensure log directory exists
  #      mkdir -p /var/log/suricata
#
  #      # Copy custom rules if they exist
  #      if [ -f /var/lib/suricata/rules/local.rules ]; then
  #        cp /var/lib/suricata/rules/local.rules /etc/suricata/rules/local.rules
  #      fi
#
  #      # Start Suricata with configuration
  #      suricata -c /etc/suricata/suricata.yaml \
  #               -i eth0 \
  #               -l /var/log/suricata \
  #               --init-errors-fatal \
  #               -v || echo 'Suricata failed to start, running in test mode'
#
  #      # Keep container running
  #      tail -f /dev/null
  #    "
  #  healthcheck:
  #    test: ["CMD", "test", "-f", "/var/log/suricata/fast.log"]
  #    interval: 30s
  #    timeout: 10s
  #    retries: 3
  #    start_period: 45s

  # Filebeat for shipping logs to ELK SIEM (on OpenStack SIEM VM 147.175.151.193)
  # ---------------------------------------------------------------------------
  # Automated backup service
  # ---------------------------------------------------------------------------
  # Runs on a 24-hour loop, dumping the production MySQL database and archiving
  # the production WordPress files into the ./backups/ directory on the host.
  #
  # Retention: the backup script keeps only the last 7 daily archives; older
  # files are pruned automatically to prevent unbounded disk growth.
  #
  # The service is intentionally isolated from honeypot networks and has no
  # access to honeypot data – backups are production-only.
  #
  # Security hardening: runs with no-new-privileges, drops all capabilities
  # (a backup process needs only filesystem read access, not Linux capabilities),
  # and is limited in memory and CPU to avoid interfering with live traffic.
  # ---------------------------------------------------------------------------
  backup_service:
    image: alpine:latest
    depends_on:
      production_database:
        condition: service_healthy
      production_eshop:
        condition: service_healthy
    volumes:
      - ./production_eshop_files:/source_wp:ro
      - ./backups:/backups
      - ./backups/backup.sh:/backup.sh:ro
    networks:
      - production_network
    environment:
      - MYSQL_HOST=production_database
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - BACKUP_RETENTION_DAYS=7
    command: |
      sh -c "
        apk add --no-cache mysql-client > /dev/null 2>&1
        chmod +x /backup.sh
        echo 'Backup service started. First backup in 5 minutes...'
        sleep 300
        while true; do
          /backup.sh
          echo 'Next backup in 24 hours...'
          sleep 86400
        done
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 50
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    depends_on:
      reverse_proxy:
        condition: service_started
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/certs:/etc/filebeat/certs:ro
      - ./suricata_logs:/var/log/suricata:ro
      - ./nginx_logs:/var/log/nginx:ro
      - ./filebeat/data:/usr/share/filebeat/data
      - ./filebeat/logs:/var/log/filebeat
      # Docker socket and container logs for monitoring all containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Redis logs (if available)
      - ./redis_data:/var/log/redis:ro
    environment:
      - ELK_ENABLED=${ELK_ENABLED:-true}
      - LOGSTASH_HOST=${LOGSTASH_HOST:-147.175.151.193}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-5044}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-147.175.151.193}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_ENABLED=${ELASTICSEARCH_SSL_ENABLED:-true}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - KIBANA_HOST=${KIBANA_HOST:-147.175.151.193}
      - KIBANA_PORT=${KIBANA_PORT:-5601}
      - KIBANA_PROTOCOL=${KIBANA_PROTOCOL:-https}
      - KIBANA_SSL_ENABLED=${KIBANA_SSL_ENABLED:-true}
      - KIBANA_SSL_VERIFY=${KIBANA_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}
    networks:
      - monitoring_network
    command: filebeat -e -strict.perms=false
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Enhanced reverse proxy with Lua-based honeynet routing
  # ---------------------------------------------------------------------------
  # Waits for ALL three honeypot pool instances to be healthy before accepting
  # traffic so that pool_router.lua never routes to a pool that is still starting.
  # ---------------------------------------------------------------------------
  reverse_proxy:
    build:
      context: ./reverse_proxy_enhanced
      dockerfile: Dockerfile
    depends_on:
      production_eshop:
        condition: service_healthy
      honeypot_eshop_1:
        condition: service_healthy
      honeypot_eshop_2:
        condition: service_healthy
      honeypot_eshop_3:
        condition: service_healthy
      session_store:
        condition: service_healthy
      #session_manager:
      #  condition: service_healthy
      #suricata_ids:
      #  condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse_proxy_enhanced:/etc/nginx
      - ./ssl_certificates:/etc/ssl/certs:ro
      - ./nginx_logs:/var/log/nginx
    networks:
      - production_network
      - honeypot_network
      - session_network
      - monitoring_network
      - ids_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # - SESSION_MANAGER_URL=http://session_manager:3001
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

