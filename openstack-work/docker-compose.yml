name: honeypot-ids-system-v1
services:
  # Initialization service to copy production files to honeypot and generate SSL
  init_setup:
    image: alpine:latest
    volumes:
      - ./production_eshop_files:/source_files:ro
      - ./production_database_data:/source_db:ro
      - ./honeypot_eshop_files:/dest_files
      - ./honeypot_database_data:/dest_db
      - ./ssl_certificates:/ssl_certs
    command: |
      sh -c "
      set -x
      echo 'Starting initialization setup...'
      
      # Copy production files to honeypot (overwrite existing)
      if [ -d '/source_files' ] && [ -n \"$$(find /source_files -mindepth 1 -maxdepth 1)\" ]; then
        echo 'Copying production WordPress files to honeypot...'
        find /dest_files -mindepth 1 -delete
        cp -a /source_files/. /dest_files/ 2>/dev/null || echo 'No files to copy yet'
      else
        echo 'Production files not found or empty, skipping file copy'
      fi
      
      # Copy production database to honeypot (overwrite existing)
      if [ -d '/source_db' ] && [ -n \"$$(find /source_db -mindepth 1 -maxdepth 1)\" ]; then
        echo 'Copying production database to honeypot...'
        find /dest_db -mindepth 1 -delete
        cp -a /source_db/. /dest_db/ 2>/dev/null || echo 'No database files to copy yet'
      else
        echo 'Production database not found or empty, skipping database copy'
      fi
      
      # Generate self-signed SSL certificates
      echo 'Generating SSL certificates...'
      apk add --no-cache openssl
      
      if [ ! -f '/ssl_certs/server.crt' ] || [ ! -f '/ssl_certs/server.key' ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /ssl_certs/server.key -out /ssl_certs/server.crt -subj '/C=US/ST=State/L=City/O=HoneypotOrg/CN=localhost'
        chmod 600 /ssl_certs/server.key
        chmod 644 /ssl_certs/server.crt
        echo 'SSL certificates generated successfully'
      else
        echo 'SSL certificates already exist, skipping generation'
      fi
      
      echo 'Initialization setup completed successfully'
      set +x
      "

  # Database migration applier for honeypot
  honeypot_db_migration:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
      honeypot_database:
        condition: service_healthy
    volumes:
      - ./honeypot_database_migrations:/migrations:ro
    environment:
      - MYSQL_HOST=honeypot_database
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: |
      bash -c "
      echo 'Waiting for honeypot database to be ready...'
      sleep 5
      
      echo 'Applying honeypot database migrations...'
      
      # Check if migrations directory exists and has SQL files
      if [ -d '/migrations' ] && [ -n \"$$(find /migrations -name '*.sql' -type f)\" ]; then
        # Apply migrations in order
        for migration in /migrations/*.sql; do
          if [ -f \"$$migration\" ]; then
            echo \"Applying migration: $$migration\"
            mysql -h$$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE < \"$$migration\"
            if [ $$? -eq 0 ]; then
              echo \"✓ Migration $$migration applied successfully\"
            else
              echo \"✗ Migration $$migration failed\"
              exit 1
            fi
          fi
        done
        echo 'All honeypot database migrations applied successfully'
      else
        echo 'No migrations found, skipping...'
      fi
      "
    networks:
      - honeypot_network

  # Production WordPress database
  production_database:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./production_database_data:/var/lib/mysql
    networks:
      - production_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Production WordPress instance (clean, secure)
  production_eshop:
    image: wordpress:6.8.3-php8.1
    depends_on:
      production_database:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
    # ports:
    #   - "80:80" # temporary port for direct access
    volumes:
      - ./production_eshop_files:/var/www/html
    networks:
      - production_network
      - honeypot_network  # Added: Allow access to honeypot database for SQL routing
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Honeypot WordPress database
  honeypot_database:
    image: mysql:5.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    command: |
      bash -c "
        rm -f /var/lib/mysql/placeholder
        docker-entrypoint.sh mysqld
      "
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./honeypot_database_data:/var/lib/mysql
    networks:
      - honeypot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "production_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Honeypot WordPress instance (vulnerable)
  honeypot_eshop:
    image: wordpress:6.8.3-php8.1
    depends_on:
      honeypot_database:
        condition: service_healthy
      honeypot_db_migration: # important so honeypot does not get served without dummy data
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
    # ports:
    #   - "8080:80" # temporary port for direct access
    volumes:
      - ./honeypot_eshop_files:/var/www/html
    networks:
      - honeypot_network
      - production_network  # Added: Allow access to production database for SQL routing
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for session management and threat intelligence
  session_store:
    image: redis:7-alpine
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - ./redis_data:/data
      - ./redis_config:/usr/local/etc/redis
    networks:
      - session_network
    command: |
      sh -c "
      echo 'Starting Redis with fresh data...'
      rm -rf /data/*
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
      "
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

