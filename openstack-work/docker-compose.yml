networks:
  setup_network:
    driver: bridge
  production_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  honeypot_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  session_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  ids_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  production_database_data:
    driver: local
  honeypot_database_data:
    driver: local
  redis_data:
    driver: local
  suricata_logs:
    driver: local
  threat_intel_data:
    driver: local
  nginx_logs:
    driver: local
  ssl_certificates:
    driver: local