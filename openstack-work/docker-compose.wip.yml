version: '3.8'

services:
  nginx_gateway:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - ./monitoring/nginx_logs:/var/log/nginx
    depends_on:
      - behavior_analyzer
      - production_app
      - honeypot_app

  behavior_analyzer:
    build:
      context: ./analyzer
      dockerfile: Dockerfile
    volumes:
      - ./monitoring/behavior_logs:/var/log/analyzer
    environment:
      - ANALYSIS_THRESHOLD=0.75
      - LOG_LEVEL=info

  production_app:
    build:
      context: ./production
      dockerfile: Dockerfile
    volumes:
      - ./monitoring/prod_logs:/var/log/app
    environment:
      - APP_ENV=production
    networks:
      - prod_network

  honeypot_app:
    build:
      context: ./honeypot
      dockerfile: Dockerfile
    volumes:
      - ./monitoring/honeypot_logs:/var/log/honeypot
    environment:
      - HONEYPOT_MODE=active
    networks:
      - honeypot_network

  redis_session:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - prod_network
      - honeypot_network

volumes:
  redis_data:

networks:
  prod_network:
    driver: bridge
  honeypot_network:
    driver: bridge
