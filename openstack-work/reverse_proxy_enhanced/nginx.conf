worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'session_id="$cookie_PHPSESSID" route="$route_decision" '
                       'threat_score="$threat_score" suspicious="$suspicious_activity"';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/security.log security;

    # Hide nginx version
    server_tokens off;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 128M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;

    # Lua shared dictionaries
    lua_shared_dict sessions 10m;
    lua_shared_dict threat_intel 10m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict honeypot_routes 1m;

    # Lua modules path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Initialize Lua components
    init_by_lua_file /etc/nginx/lua/init.lua;
    init_worker_by_lua_file /etc/nginx/lua/init_worker.lua;

    # Upstream definitions
    upstream production_backend {
        server production_eshop:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 32;
    }

    upstream honeypot_backend {
        server honeypot_eshop:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 32;
    }

    upstream session_manager {
        server session_manager:3001 max_fails=2 fail_timeout=10s;
        keepalive 8;
    }

    # Security headers map
    map $sent_http_content_type $security_headers {
        default "X-Frame-Options: SAMEORIGIN; X-Content-Type-Options: nosniff; X-XSS-Protection: 1; mode=block; Referrer-Policy: strict-origin-when-cross-origin";
    }

    # Main server block
    server {
        listen 80;
        server_name openstack.local *.openstack.local;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

        # Variables for routing decision
        set $route_decision "production";
        set $threat_score "0";
        set $suspicious_activity "false";
        set $backend_upstream "production_backend";

        # Main routing logic using Lua
        access_by_lua_block {
            local session_handler = require "session_handler"
            local threat_analyzer = require "threat_analyzer"
            local router = require "router"
            
            -- Analyze current request for threats
            local threat_result = threat_analyzer.analyze_request(ngx.var.request_uri, 
                                                                ngx.req.get_headers(), 
                                                                ngx.var.remote_addr)
            
            -- Set threat variables
            ngx.var.threat_score = tostring(threat_result.score)
            ngx.var.suspicious_activity = tostring(threat_result.suspicious)
            
            -- Get or create session
            local session_id = ngx.var.cookie_PHPSESSID or session_handler.generate_session_id()
            local session_data = session_handler.get_session(session_id)
            
            -- Make routing decision
            local routing_decision = router.decide_route(session_data, threat_result, ngx.var.remote_addr)
            
            -- Set routing variables
            ngx.var.route_decision = routing_decision.target
            ngx.var.backend_upstream = routing_decision.upstream
            
            -- Update session if needed
            if routing_decision.update_session then
                session_handler.update_session(session_id, routing_decision.session_data)
            end
            
            -- Log suspicious activity
            if threat_result.suspicious then
                ngx.log(ngx.WARN, "Suspicious activity detected from ", ngx.var.remote_addr, 
                       " - Score: ", threat_result.score, " - Routing to: ", routing_decision.target)
            end
        }

        # Rate limiting for sensitive endpoints
        location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php) {
            limit_req zone=login burst=3 nodelay;
            
            # Additional Lua processing for admin access
            access_by_lua_block {
                local admin_handler = require "admin_handler"
                admin_handler.process_admin_request(ngx.var.remote_addr, ngx.var.request_uri)
            }
            
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # API endpoints with different rate limiting
        location ~* ^/wp-json/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Vulnerable plugin endpoints - force honeypot routing
        location ~* ^/wp-content/plugins/(woocommerce-payments|abandoned-cart-lite|drag-and-drop-multiple-file-upload|cwmp|gift-voucher|advanced-form-integration|pagseguro-connect-woocommerce|wp-file-upload)/.*$ {
            set $route_decision "honeypot";
            set $backend_upstream "honeypot_backend";
            
            access_by_lua_block {
                local vuln_handler = require "vulnerability_handler"
                vuln_handler.log_vulnerable_access(ngx.var.remote_addr, ngx.var.request_uri)
                
                -- Mark session as compromised
                local session_id = ngx.var.cookie_PHPSESSID
                if session_id then
                    local session_handler = require "session_handler"
                    session_handler.mark_compromised(session_id, "vulnerable_plugin_access")
                end
            }
            
            proxy_pass http://honeypot_backend;
            include /etc/nginx/proxy_params;
        }

        # File upload handling with threat analysis
        location ~* ^/wp-admin/admin-ajax\.php$ {
            client_max_body_size 200M;
            
            access_by_lua_block {
                local upload_handler = require "upload_handler"
                
                -- Analyze upload requests
                if ngx.var.request_method == "POST" then
                    local is_suspicious = upload_handler.analyze_upload(ngx.req.get_headers(), 
                                                                      ngx.var.args)
                    if is_suspicious then
                        ngx.var.route_decision = "honeypot"
                        ngx.var.backend_upstream = "honeypot_backend"
                        ngx.var.suspicious_activity = "true"
                    end
                end
            }
            
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Default location for all other requests
        location / {
            limit_req zone=general burst=10 nodelay;
            
            # Log routing decisions
            header_filter_by_lua_block {
                ngx.header["X-Route-Target"] = ngx.var.route_decision
                ngx.header["X-Threat-Score"] = ngx.var.threat_score
            }
            
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Session management API proxy
        location /api/session/ {
            proxy_pass http://session_manager/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block common attack vectors
        location ~* \.(sql|log|ini|conf|bak|backup|old|tmp)$ {
            deny all;
        }

        location ~* /\.(ht|git|svn) {
            deny all;
        }
    }

    # HTTPS server (when SSL certificates are available)
    server {
        listen 443 ssl http2;
        server_name openstack.local *.openstack.local;

        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Same configuration as HTTP server but with HTTPS context
        include /etc/nginx/https_common.conf;
    }

    # Include proxy parameters
    include /etc/nginx/proxy_params;
}