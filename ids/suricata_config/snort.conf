###################################################
# Snort 3 Configuration File
# Honeypot IDS Integration
###################################################

---------------------------------------------------------------------------
-- 1. setup the network addresses you are protecting
---------------------------------------------------------------------------

HOME_NET = [[ 172.20.0.0/24 172.21.0.0/24 172.22.0.0/24 172.23.0.0/24 172.24.0.0/24 ]]
EXTERNAL_NET = '!$HOME_NET'

---------------------------------------------------------------------------
-- 2. configure the decoder
---------------------------------------------------------------------------

stream = { }

stream_ip = { }

stream_icmp = { }

stream_tcp = {
    policy = 'linux',
    reassemble_both = true,
    reassemble_client = true,
    reassemble_server = true,
    flush_factor = 0,
    max_window = 0,
    overlap_limit = 10,
    max_queued_bytes = 1048576,
    max_queued_segs = 2621,
    small_segments = {
        count = 0,
        maximum_size = 0,
    },
    show_rebuilt_packets = false,
    check_session_hijacking = false,
    max_consec_small_segs = 0,
    max_consec_small_seg_threshold = 0
}

stream_udp = { 
    session_timeout = 30
}

stream_user = { }

stream_file = { }

---------------------------------------------------------------------------
-- 3. configure inspection
---------------------------------------------------------------------------

wizard = default
binder = {
    { when = { proto = 'udp', ports = '53' }, use = { type = 'wizard' } },
    { when = { proto = 'tcp', ports = '21 22 23 25 53 80 110 135 136 137 139 143 443 445 993 995 1433 1521 3306 5432 6667 7000 8080 8180 8888 9001' }, use = { type = 'wizard' } },
    { use = { type = 'wizard' } }
}

---------------------------------------------------------------------------
-- 4. configure detection
---------------------------------------------------------------------------

references = default
classifications = default

ips = {
    -- use this to enable decoder and inspector alerts
    enable_builtin_rules = true,
    
    -- use include for rules files; be sure to set your path
    -- note that rules files can include other rules files
    include = '/usr/local/etc/rules/local.rules',
    
    variables = default_variables
}

---------------------------------------------------------------------------
-- 5. configure event logging
---------------------------------------------------------------------------

# unified2 output for external processing
unified2 = {
    filename = '/var/log/snort/snort.u2',
    mpls_event_types = true,
    vlan_event_types = true
}

# fast alert output for real-time processing
alert_fast = {
    file = '/var/log/snort/alert_fast',
    packet = false,
    limit = 100
}

# full alert output with packet details
alert_full = {
    file = '/var/log/snort/alert_full',
    limit = 20
}

# CSV output for easy parsing
alert_csv = {
    file = '/var/log/snort/alert.csv',
    fields = 'timestamp pkt_num proto pkt_gen pkt_len dir src_ap dst_ap rule action',
    limit = 100,
    separator = ','
}

# JSON output for structured logging
alert_json = {
    file = '/var/log/snort/alert.json',
    fields = 'timestamp pkt_num proto pkt_gen pkt_len dir src_ap dst_ap rule action msg',
    limit = 100
}

# Syslog output for centralized logging
alert_syslog = {
    facility = 'LOG_AUTH',
    level = 'LOG_ALERT'
}

---------------------------------------------------------------------------
-- 6. configure performance monitoring
---------------------------------------------------------------------------

perf_monitor = {
    base = true,
    flow = true,
    flow_ip = true,
    cpu = true,
    packets = 10000,
    seconds = 60
}

---------------------------------------------------------------------------
-- 7. configure HTTP inspection for web attacks
---------------------------------------------------------------------------

http_inspect = {
    request_depth = 0,
    response_depth = 0,
    unzip = true,
    normalize_utf = true,
    normalize_javascript = true,
    max_javascript_whitespaces = 200,
    normalize_cookies = true,
    enable_xff = true,
    xff_headers = 'x-forwarded-for true-client-ip',
    log_uri = true,
    log_hostname = true
}

http2_inspect = { }

---------------------------------------------------------------------------
-- 8. configure file inspection
---------------------------------------------------------------------------

file_id = {
    enable_type = true,
    enable_signature = true,
    enable_capture = true,
    file_rules = '/usr/local/etc/rules/file_magic.rules',
    trace_type = true,
    trace_signature = true,
    verdict_delay = 0,
    file_policy = 
    {
        { when = { file_type_id = 22 }, use = { verdict = 'log', enable_file_signature = true } },
        { when = { file_type_id = 7 }, use = { verdict = 'log', enable_file_signature = true } },
        { when = { file_type_id = 30 }, use = { verdict = 'log', enable_file_signature = true } },
        { when = { file_type_id = 25 }, use = { verdict = 'log', enable_file_signature = true } },
        { use = { verdict = 'log' } }
    }
}

---------------------------------------------------------------------------
-- 9. configure application layer gateways
---------------------------------------------------------------------------

ftp_server = default
ftp_client = { }
ftp_data = { }

telnet = default

smtp = default

imap = default
pop = default

ssh = { }

dcerpc = default
smb = default

dns = default

ssl = {
    trust_servers = true
}

---------------------------------------------------------------------------
-- 10. configure reputation
---------------------------------------------------------------------------

reputation = {
    memcap = 500,
    scan_local = false,
    blacklist = 'blacklist.rules',
    whitelist = 'whitelist.rules'
}

---------------------------------------------------------------------------
-- 11. configure active response
---------------------------------------------------------------------------

react = {
    page = '/usr/local/etc/snort/block.html'
}

reject = { }

---------------------------------------------------------------------------
-- 12. configure honeypot-specific detection
---------------------------------------------------------------------------

# Custom detection for WordPress vulnerabilities
http_server = {
    profile = {
        { server = 'wordpress', flow_depth = 0, client_flow_depth = 0, post_depth = 0, oversize_dir_length = 500 }
    }
}

# Port scanning detection
portscan = {
    proto = 'all',
    scan_type = 'all',
    sense_level = 'medium',
    watch_ip = HOME_NET,
    memcap = 10000000,
    logfile = '/var/log/snort/portscan.log'
}

# Rate limiting for connection attempts  
rate_filter = {
    track = 'by_src',
    count = 100,
    seconds = 60,
    new_action = 'alert',
    timeout = 300,
    apply_to = '$HOME_NET'
}

---------------------------------------------------------------------------
-- 13. configure normalizers
---------------------------------------------------------------------------

normalizer = {
    tcp = {
        ips = true,
        urp = true,
        trim_syn = true,
        trim_rst = true,
        trim_win = true,
        trim_mss = true,
        ecn = 'packet',
        opts = true
    },
    
    icmp4 = {
        dsize = true
    },
    
    icmp6 = {
        dsize = true
    },
    
    ip4 = {
        df = true,
        rf = true,
        tos = true,
        id = true
    },
    
    ip6 = {
        hops = true
    }
}

---------------------------------------------------------------------------
-- 14. configure output plugins for integration
---------------------------------------------------------------------------

# Custom output for session management integration
output = {
    alert_syslog = {
        facility = 'LOG_LOCAL0',
        level = 'LOG_ALERT',
        options = 'LOG_CONS'
    }
}

---------------------------------------------------------------------------
-- 15. configure detection engine
---------------------------------------------------------------------------

detection = {
    max_queue_events = 5,
    enable_builtin_rules = true,
    bleedingthreats_rules = false
}

---------------------------------------------------------------------------
-- 16. configure search engine
---------------------------------------------------------------------------

search_engine = {
    search_method = 'ac_bnfa',
    search_optimize = true,
    maximum_pattern_length = 20
}

---------------------------------------------------------------------------
-- 17. configure event queue  
---------------------------------------------------------------------------

event_queue = {
    max_queue = 8,
    log = 3,
    order_events = 'content_length'
}

---------------------------------------------------------------------------
-- 18. configure memory management
---------------------------------------------------------------------------

memory = {
    cap = 256
}

---------------------------------------------------------------------------
-- 19. configure latency monitoring
---------------------------------------------------------------------------

latency = {
    packet = { max_time = 1500 },
    rule = { max_time = 1000 }
}

---------------------------------------------------------------------------
-- 20. configure profiling
---------------------------------------------------------------------------

profiler = {
    modules = true,
    rules = true,
    memory = true
}