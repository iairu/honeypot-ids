worker_processes auto;
error_log /var/log/nginx/error.log info;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

# Make environment variables available to Lua
env REDIS_PASSWORD;
env ABUSEIPDB_API_KEY;
env ABUSEIPDB_CONFIDENCE_MINIMUM;
env ABUSEIPDB_DAILY_CHECK_LIMIT;
env INTERNAL_TEST_SECRET;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    # session_id was $cookie_PHPSESSID until this fix -- that's WordPress's
    # OWN incidental PHP session cookie (only ever set once a real PHP
    # session starts server-side, e.g. login/cart), completely unrelated to
    # this system's actual session tracking. session_handler.lua/init.lua's
    # _G.config.session.cookie_name sets and reads a DIFFERENT cookie,
    # "HONEYPOT_SESSION" -- the one every session_id this system's own code
    # actually generates, stores in Redis, and logs via log_security_event()
    # is keyed on (see §3.5). Confirmed live: $cookie_PHPSESSID was empty
    # ("-") on essentially every request, including ones the honeypot had
    # already assigned a real, stable HONEYPOT_SESSION cookie to -- meaning
    # this log's session_id field was silently disconnected from the rest
    # of the system's session tracking for as long as this line existed.
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'session_id="$cookie_HONEYPOT_SESSION" route="$route_decision" '
                       'threat_score="$threat_score" suspicious="$suspicious_activity"';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/security.log security;
    access_log /dev/stdout main;

    # Hide nginx version in error pages and Server header.
    # OpenResty's more_set_headers module rewrites the Server header to a
    # generic string so that automated scanners (Shodan, WPScan, Nuclei) cannot
    # determine the exact Nginx or OpenResty release from HTTP responses alone.
    server_tokens off;
    more_set_headers "Server: nginx";

    # Strip X-Powered-By that PHP/Apache/WordPress may inject into proxied
    # responses before we forward them to the client.  Exposing "PHP/8.1.x"
    # lets attackers target known PHP CVEs without any additional recon.
    more_clear_headers "X-Powered-By";
    more_clear_headers "X-Generator";
    more_clear_headers "X-Pingback";

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 128M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # DNS resolver for Docker service names
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Per-IP request-rate limiting. Previously there was NO rate limiting
    # anywhere in this file -- confirmed live by firing 40 fully-concurrent
    # requests from one IP and observing all 40 return 200 with zero
    # throttling (attack-test log, repo root). The Lua-level threat scoring
    # (Stage 9, "rapid automation detected") is a *detection* signal that
    # affects routing, not a request-blocking mechanism -- a request that
    # trips it still gets fully processed by a real backend either way, so
    # it provides no actual resource protection against a request flood.
    # 20r/s with a burst of 60 is deliberately generous: a real WooCommerce
    # page load can legitimately fire 30+ near-simultaneous static-asset
    # requests (confirmed in check-me.log, repo root), and this must not
    # throttle that. It's meant to catch genuinely excessive, sustained
    # per-IP request rates (flooding/brute-force), not normal browsing.
    # NOTE: this zone does not currently exempt whitelisted IPs
    # (_G.utils.is_ip_whitelisted in init.lua) -- that whitelist is
    # Lua/session-level and doesn't automatically extend to this separate,
    # lower-level nginx mechanism. Flagged as a follow-up if trusted
    # high-volume sources (monitoring, load testing) need an explicit
    # `geo`/`map`-based exemption.
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_status 429;

    # Proxy cache configuration for static assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 304 1d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    # Rate limiting disabled for end users

    # Lua shared dictionaries
    lua_shared_dict sessions 10m;
    lua_shared_dict threat_intel 10m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict honeypot_routes 1m;

    # Lua modules path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Every cosocket user in lua/ (health_check.lua's backend HEAD probes,
    # wp_install_state.lua, abuseipdb_client.lua, init.lua's Redis pool)
    # already checks the returned error and logs it with context (which
    # backend, which task, what was being attempted). With this left at
    # its default, OpenResty ALSO logs the bare kernel-level failure for
    # the same event at [error] -- "lua tcp socket read timed out,
    # upstream: session_store:6379(...), context: ngx.timer" -- with no
    # indication of which timer or call hit it, right above the module's
    # own [warn]/[error] line that says exactly that. Turning it off is the
    # documented recommendation for code that handles its own cosocket
    # errors; nothing is lost, the duplicate context-free line goes away.
    lua_socket_log_errors off;

    # Trust the system CA bundle for outbound HTTPS cosockets opened via
    # lua-resty-http (abuseipdb_client.lua). ssl_verify=true on those calls
    # does NOT fall back to the OS trust store automatically like curl does --
    # OpenResty cosockets only trust what's named here. The bundle lives
    # under /usr/local/openresty (see Dockerfile) rather than the usual
    # /etc/ssl/certs, because docker-compose.yml bind-mounts a host
    # directory over /etc/ssl/certs at runtime, which would otherwise
    # shadow the CA bundle apk installed there at build time.
    lua_ssl_trusted_certificate /usr/local/openresty/ca-certificates.crt;
    lua_ssl_verify_depth 2;

    # Initialize Lua components
    init_by_lua_file /etc/nginx/lua/init.lua;
    init_worker_by_lua_file /etc/nginx/lua/init_worker.lua;

    # Upstream definitions
    upstream production_backend {
        server production_eshop:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 512;
        keepalive_requests 10000;
        keepalive_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Honeypot pool upstreams
    #
    # Each pool_N upstream points to a dedicated WordPress + MySQL pair so that
    # every attacking IP gets its own isolated fake environment.  pool_router.lua
    # selects the upstream name at request time based on the IP's sticky assignment
    # stored in Redis (key: honeypot_pool_ip:<IP>).
    #
    # The number of pool blocks here MUST match POOL_COUNT in pool_router.lua and
    # the number of honeypot_eshop_N services defined in docker-compose.yml.
    # ---------------------------------------------------------------------------

    # Pool 1 – primary honeypot instance (uses the original honeypot_eshop_1 service)
    upstream honeypot_backend_1 {
        server honeypot_eshop_1:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Pool 2 – second isolated honeypot instance
    upstream honeypot_backend_2 {
        server honeypot_eshop_2:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Pool 3 – third isolated honeypot instance
    upstream honeypot_backend_3 {
        server honeypot_eshop_3:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Generic honeypot_backend alias kept for backward compatibility with any
    # code paths that still reference the old name (e.g. legacy Lua branches that
    # have not yet been updated to pool-based routing).  Routes to pool 1.
    upstream honeypot_backend {
        server honeypot_eshop_1:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # upstream session_manager {
    #     server session_manager:3001 max_fails=2 fail_timeout=10s;
    #     keepalive 8;
    # }

    # Security headers map
    map $sent_http_content_type $security_headers {
        default "X-Frame-Options: SAMEORIGIN; X-Content-Type-Options: nosniff; X-XSS-Protection: 1; mode=block; Referrer-Policy: strict-origin-when-cross-origin";
    }

    # Connection upgrade map for WebSockets and keepalive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' "";
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name localhost *.localhost;

        # The global `security` access_log format (http{} block above)
        # references $route_decision/$threat_score/$suspicious_activity,
        # but this block never runs any Lua that would set them -- every
        # request through here is a plain redirect (or malformed/scanning
        # traffic nginx rejects outright, e.g. a raw TLS ClientHello sent to
        # the HTTP port). Without these defaults nginx logs three
        # "using uninitialized variable" warnings per request on top of the
        # access-log line itself -- confirmed as real, current log noise
        # (see check-me.log, repo root) that would spam heavily under real
        # background internet scan traffic, exactly the kind of thing this
        # port sees. Matches the same defaults set in the main server block.
        set $route_decision "production";
        set $threat_score "0";
        set $suspicious_activity "false";

        return 301 https://$host$request_uri;
    }
    
    # Main server block
    server {
        listen 443 ssl http2;
        server_name localhost *.localhost;
    
        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
    
        # HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

        # Set routing headers for all responses (server level)
        header_filter_by_lua_block {
            if ngx.var.is_static_asset ~= "1" then
                local route_decision = ngx.var.route_decision
                ngx.log(ngx.INFO, "[HEADER_FILTER] route_decision='", route_decision or "nil", "' threat_score='", ngx.var.threat_score or "nil", "'")
                -- X-Route-Target / X-Threat-Score exist for testing/validation
                -- (testing/scenario_*.sh read them externally) -- gated behind
                -- a shared secret so they don't leak the routing decision and
                -- threat score to every real client / attacker. See
                -- BLIND_PENTEST_PROTOCOL.md §8.2.
                local secret = _G.config.internal_test_secret
                if route_decision and route_decision ~= "" and
                   secret and secret ~= "" and ngx.var.http_x_internal_test_auth == secret then
                    ngx.header["X-Route-Target"] = route_decision
                    ngx.header["X-Threat-Score"] = ngx.var.threat_score or "0"
                    ngx.log(ngx.INFO, "[HEADER_FILTER] Setting X-Route-Target=", route_decision)
                else
                    ngx.log(ngx.INFO, "[HEADER_FILTER] Not setting X-Route-Target (empty decision or missing/invalid internal test auth)")
                end
                
                -- Set session cookie if this is a new session
                if ngx.var.new_session_id and ngx.var.new_session_id ~= "" then
                    local cookie_value = ngx.var.new_session_id .. "; Path=/; HttpOnly; SameSite=Lax; Secure"
                    ngx.header["Set-Cookie"] = _G.config.session.cookie_name .. "=" .. cookie_value
                    ngx.log(ngx.INFO, "[SESSION] 🍪 Setting session cookie in server header_filter: ", ngx.var.new_session_id)
                end
            else
                ngx.log(ngx.INFO, "[HEADER_FILTER] Static asset, skipping headers")
            end
        }

        # Access control - allow all IPs (Lua routing handles threats)
        # allow 127.0.0.1; # Localhost
        # allow 100.64.0.0/10; # Tailscale access
        # allow 10.0.0.0/8; # Local network access
        # allow 172.16.0.0/12; # Docker networks
        # allow 147.175.0.0/16; # STUBA
        # deny all;  -- REMOVED: Lua routing handles all threat detection

        # Per-IP request-rate limit -- see the limit_req_zone definition
        # (http{} block above) for why this exists and how the numbers were
        # chosen. nodelay: requests within the burst are served immediately
        # rather than artificially queued/delayed; only requests beyond the
        # burst get a 429.
        limit_req zone=general_limit burst=60 nodelay;

        # Variables for routing decision
        set $route_decision "production";
        set $threat_score "0";
        set $suspicious_activity "false";
        set $backend_upstream "production_backend";
        set $is_static_asset "0";
        set $new_session_id "";

        # ------------------------------------------------------------------
        # Block WordPress information-disclosure files.
        # readme.html and license.txt contain the exact WordPress version in
        # plain text. Sensitive files like readme.html are handled by Lua
        # routing so that attacker probes are captured in the honeypot
        # instead of being flatly denied. The Lua code routes based on
        # threat score.
        #
        # xmlrpc.php is handled differently, in the access_by_lua_block
        # below (search "XML-RPC block") rather than a location here --
        # this used to be a comment claiming a proxy-layer block existed
        # with no actual directive backing it (dead documentation, found
        # while working on production hardening). Blocking it needs to
        # happen AFTER the routing decision is known (production vs.
        # honeypot), which is only available once access_by_lua_block has
        # run; a plain nginx `location`+`if` here would fire during the
        # rewrite phase, before that decision exists.
        # ------------------------------------------------------------------

        # Static assets - HIGHEST PRIORITY - always route to production, bypass ALL security checks
        # Match any static file extension with or without query parameters
        location ~* ^\/((wp-content|wp-includes)\/)?.+\.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot|otf|ico|webp|webm|mp4|mp3|pdf)(\?.*)?$ {
            set $is_static_asset "1";
            expires 1d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;

            # ------------------------------------------------------------------
            # Hotlink protection for image and media assets.
            #
            # Rationale: hotlinking (embedding production images on third-party
            # sites) consumes bandwidth, can be used for canvas fingerprinting,
            # and leaks information about the production file structure.
            #
            # Policy:
            #   * Requests with NO referer are allowed (direct browser navigation,
            #     curl, search-engine crawlers, RSS readers).
            #   * Requests whose Referer matches our own hostname are allowed
            #     (images loaded by our own pages, lazy-loaded assets, etc.).
            #   * Requests from any other external domain are denied with 403.
            #
            # Only applied to images/media (jpg|jpeg|png|gif|svg|webp|webm|mp4|
            # mp3|pdf), NOT to CSS/JS/fonts because those are commonly embedded
            # by legitimate third-party pages or CDN-served stylesheets.
            # ------------------------------------------------------------------
            location ~* \.(jpg|jpeg|png|gif|svg|webp|webm|mp4|mp3|pdf)(\?.*)?$ {
                set $is_static_asset "1";
                expires 1d;
                add_header Cache-Control "public, immutable";

                # valid_referers: blank (no referer) and our server_name are OK.
                # "blocked" covers requests where the Referer header is present
                # but was stripped to just a scheme (e.g. "https://").
                valid_referers none blocked server_names;
                if ($invalid_referer) {
                    # Return 403 Forbidden for hotlink attempts from external sites.
                    return 403;
                }

                proxy_cache static_cache;
                proxy_cache_bypass $http_cache_control;
                proxy_ignore_headers Cache-Control Expires;

                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_next_upstream_timeout 15s;

                proxy_pass http://production_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_buffering on;
                proxy_buffer_size 16k;
                proxy_buffers 8 16k;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # Enable caching for static assets
            proxy_cache static_cache;
            proxy_cache_bypass $http_cache_control;
            proxy_ignore_headers Cache-Control Expires;

            # Retry logic for failed upstream connections
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;

            proxy_pass http://production_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increased timeouts to prevent 503 on first load
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        
        # Rate limiting for sensitive endpoints - handled by main access_by_lua_block and location /
        # wp-admin/wp-login.php/xmlrpc.php requests will be handled by the main routing logic
        
        # API endpoints with different rate limiting
        location ~* ^\/wp-json\/ {
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Vulnerable plugin endpoints - force honeypot routing
        location ~* ^\/wp-content\/plugins\/(woocommerce-payments|abandoned-cart-lite|drag-and-drop-multiple-file-upload|cwmp|gift-voucher|advanced-form-integration|pagseguro-connect-woocommerce|wp-file-upload)\/.*\.(php|asp|aspx|jsp)$ {
            set $route_decision "honeypot";
            set $backend_upstream "honeypot_backend";

            access_by_lua_block {
                ngx.log(ngx.ERR, "[VULNERABLE PLUGIN] 🎯 PHP file access in vulnerable plugin detected!")
                ngx.log(ngx.ERR, "[VULNERABLE PLUGIN] URI: ", ngx.var.request_uri, " | IP: ", ngx.var.remote_addr)

                local vuln_handler = require "vulnerability_handler"
                vuln_handler.log_vulnerable_access(ngx.var.remote_addr, ngx.var.request_uri)

                -- Mark session as compromised
                local session_id = ngx.var.cookie_PHPSESSID
                if session_id then
                    local session_handler = require "session_handler"
                    session_handler.mark_compromised(session_id, "vulnerable_plugin_access")
                    ngx.log(ngx.ERR, "[VULNERABLE PLUGIN] Session marked as compromised: ", session_id)
                end

                -- Route this attacker to their permanently-assigned honeypot
                -- pool (sticky per-IP via Redis, same as the main routing
                -- path in router.lua) instead of the fixed honeypot_backend
                -- alias below, which always pointed at pool 1 for every
                -- attacker regardless of who they are -- meaning unrelated
                -- attackers hitting this vulnerable-plugin fast path could
                -- share one pool. See
                -- ids/testing/test_session_binding.sh.
                local pool_router = require "pool_router"
                local pool_num = pool_router.get_or_assign_pool(ngx.var.remote_addr)
                ngx.var.backend_upstream = pool_router.get_upstream_for_pool(pool_num)
                pool_router.refresh_assignment_ttl(ngx.var.remote_addr)
                ngx.log(ngx.WARN, "[VULNERABLE PLUGIN] IP ", ngx.var.remote_addr, " assigned to pool ", pool_num)
            }

            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # admin-ajax.php: only bumps the body-size limit for genuine file
        # uploads through WordPress's AJAX router. Deliberately has NO
        # access_by_lua_block of its own -- it inherits the server-level
        # one (below), the same main threat_analyzer/router.lua pipeline
        # every other request goes through. This used to define its own
        # access_by_lua_block here, which OVERRIDES rather than merges with
        # the inherited one in nginx/OpenResty -- so admin-ajax.php
        # requests never got session-based accumulation, IP reputation,
        # CVE matching, or any other pipeline signal, only this location's
        # own one-shot upload_handler check with its own disconnected
        # routing decision. threat_analyzer.lua's Stage 6b now runs
        # upload_handler's analysis as part of the normal pipeline instead.
        location ~* ^\/wp-admin\/admin-ajax\.php$ {
            client_max_body_size 200M;

            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Main routing logic using Lua
        access_by_lua_block {
            -- Skip Lua processing for static assets
            if ngx.var.is_static_asset == "1" then
                return
            end

            local session_handler = require "session_handler"
            local threat_analyzer = require "threat_analyzer"
            local router = require "router"

            -- Log request start
            ngx.log(ngx.INFO, "")
            ngx.log(ngx.INFO, "========================================")
            ngx.log(ngx.INFO, "[REQUEST START] ", ngx.var.request_method, " ", ngx.var.request_uri)
            ngx.log(ngx.INFO, "[REQUEST] IP: ", ngx.var.remote_addr, " | User-Agent: ", (ngx.var.http_user_agent or "none"):sub(1, 80))

            -- Check for honeytoken usage BEFORE threat scoring.
            -- If a previously-injected fake credential appears in this request
            -- it means the attacker exfiltrated it from the honeypot and is now
            -- trying to use it.  This is a confirmed-compromise signal: force
            -- the request to honeypot immediately and flag the session with a
            -- maximum threat score so all subsequent requests also go to honeypot.
            local honeytoken_handler = require "honeytoken_handler"
            local ht_result = honeytoken_handler.analyze_request_for_tokens()
            if ht_result then
                ngx.log(ngx.CRIT,
                    "[HONEYTOKEN] Confirmed token reuse – forcing honeypot | ",
                    "token=", ht_result.token_id,
                    " severity=", ht_result.severity,
                    " ip=", ngx.var.remote_addr)
                -- Inject a synthetic maximum threat score so the routing
                -- pipeline below sends this request straight to honeypot.
                ngx.var.threat_score = "100"
                ngx.var.suspicious_activity = "true"
            end

            -- Analyze current request for threats
            local request_headers = ngx.req.get_headers()
            local threat_result = threat_analyzer.analyze_request(
                ngx.var.request_uri,
                request_headers,
                ngx.var.remote_addr
            )

            -- Merge honeytoken signal into threat result if one was detected.
            if ht_result then
                threat_result.score = 100
                threat_result.suspicious = true
                table.insert(threat_result.patterns_matched, "honeytoken_reuse:" .. ht_result.token_id)
            end

            -- Admin area logging for wp-admin/wp-login.php/xmlrpc.php
            local admin_uri = ngx.var.request_uri or ""
            if string.match(admin_uri, "^/wp%-admin") or string.match(admin_uri, "^/wp%-login%.php") or string.match(admin_uri, "^/xmlrpc%.php") then
                local admin_handler = require "admin_handler"
                admin_handler.process_admin_request(ngx.var.remote_addr, admin_uri)
            end

            -- Set threat variables
            -- (ngx.var.threat_score itself is set AFTER decide_route()
            -- below, not here -- decide_route() mutates threat_result.score
            -- in place, folding in the session's own decayed/accumulated
            -- history (router.lua's score-accumulation block) before any
            -- stage compares it against a threshold. Setting it here would
            -- capture the raw pre-accumulation value, which is what this
            -- variable feeds into logs and the dashboard's score display --
            -- confirmed live those showed a misleadingly low number even
            -- while route_decision correctly stayed "honeypot".)
            ngx.var.suspicious_activity = tostring(threat_result.suspicious)

            -- Get or create session.
            --
            -- A missing cookie does NOT by itself mean "new visitor" -- it's
            -- trivial for a client to clear cookies/localStorage, and that
            -- must not be a way to silently walk an already-elevated
            -- threat_score or a honeypot_bound=true session back to a clean
            -- slate. Before generating a brand-new session, fall back to
            -- the server-side IP->session_id binding (session_handler.
            -- get_session_id_for_ip(), refreshed on every session create/
            -- update) to recover the SAME session for a returning IP. Only
            -- a genuinely first-ever request from this IP (no cookie AND no
            -- IP binding, or the binding pointed at an already-expired
            -- session) gets a fresh, zero-score session.
            local session_id = ngx.var.cookie_PHPSESSID or ngx.var.cookie_HONEYPOT_SESSION
            local is_new_session = false
            local recovered_via_ip = false
            ngx.log(ngx.INFO, "[SESSION DEBUG] cookie_PHPSESSID=", ngx.var.cookie_PHPSESSID or "nil", " cookie_HONEYPOT_SESSION=", ngx.var.cookie_HONEYPOT_SESSION or "nil", " session_id=", session_id or "nil")

            if not session_id then
                session_id = session_handler.get_session_id_for_ip(ngx.var.remote_addr)
                if session_id then
                    recovered_via_ip = true
                    ngx.log(ngx.WARN, "[SESSION] 🔁 No session cookie from IP ", ngx.var.remote_addr,
                            " but a session is already bound to it -- recovering session ", session_id,
                            " instead of starting fresh")
                end
            end

            if not session_id then
                session_id = session_handler.generate_session_id()
                is_new_session = true  -- This is a brand new session
                ngx.log(ngx.INFO, "[SESSION DEBUG] Generated new session_id=", session_id)
            end
            -- Store session_id for use in router and update_session
            ngx.ctx.session_id = session_id
            local session_data = session_handler.get_session(session_id)

            if recovered_via_ip and not session_data then
                -- The IP binding pointed at a session_id that's since expired
                -- from Redis (TTL race) -- fall back to a genuinely fresh
                -- session rather than routing on a nil session_data.
                ngx.log(ngx.WARN, "[SESSION] IP-bound session ", session_id, " no longer exists -- creating a new one")
                recovered_via_ip = false
                session_id = session_handler.generate_session_id()
                is_new_session = true
                ngx.ctx.session_id = session_id
            elseif recovered_via_ip then
                -- Re-issue the cookie so this client is back on the fast
                -- cookie-lookup path for its next request instead of
                -- repeating the IP fallback every time.
                is_new_session = true

                -- Logged only, not enforced -- see fingerprint_matches()'s
                -- comment for why a mismatch doesn't block recovery.
                if not session_handler.fingerprint_matches(session_data, ngx.var.http_user_agent) then
                    ngx.log(ngx.WARN, "[SESSION] ⚠️  IP-recovered session's browser fingerprint differs from "
                            .. "the current request -- possibly a different client sharing IP ",
                            ngx.var.remote_addr, " | Session: ", session_id)
                end
            end

            if session_data then
                ngx.log(ngx.INFO, "[SESSION DEBUG] Found existing session: ", session_data.id, " honeypot_bound=", tostring(session_data.honeypot_bound))
            else
                ngx.log(ngx.INFO, "[SESSION DEBUG] No existing session found")
            end

            -- Make routing decision
            local routing_decision = router.decide_route(session_data, threat_result, ngx.var.remote_addr, ngx.ctx.session_id)

            -- Set routing variables
            ngx.var.route_decision = routing_decision.target
            ngx.var.backend_upstream = routing_decision.upstream
            -- threat_result.score was mutated in place by decide_route()'s
            -- score-accumulation block -- this is the accumulated/decayed
            -- effective score that actually drove the routing decision
            -- above, not just this one request's isolated score.
            ngx.var.threat_score = tostring(threat_result.score)

            -- XML-RPC block (production hardening): production has zero
            -- legitimate use for xmlrpc.php (see production-hardening.php's
            -- own reasoning -- Jetpack remote/WP mobile app both moved to
            -- the REST API years ago). The mu-plugin already returns 403
            -- for it at the WordPress layer, but that still costs a full
            -- PHP-FPM round-trip per attempt. Block it here, before
            -- proxy_pass, for any request the routing decision above sent
            -- to production -- deliberately does NOT block it for
            -- honeypot-bound requests, since attackers actually probing
            -- xmlrpc.php there (brute-force via system.multicall, DDoS
            -- amplification via pingback.extensions.getPingbacks) is
            -- exactly the capture surface this system exists to observe.
            if routing_decision.target == "production" and string.match(ngx.var.request_uri or "", "^/xmlrpc%.php") then
                ngx.log(ngx.WARN, "[XML-RPC] Blocked direct production access | IP: ", ngx.var.remote_addr)
                ngx.header["Content-Type"] = "text/plain; charset=UTF-8"
                ngx.status = 403
                ngx.say("XML-RPC services are disabled on this server.")
                return ngx.exit(403)
            end

            -- Store session info for header_filter phase
            -- Store session_id for header_filter if this is a new session
            if is_new_session then
                ngx.var.new_session_id = session_id
                ngx.log(ngx.INFO, "[SESSION] Setting new_session_id=", session_id)
            end

            -- Log final routing decision. "/", honeypot_threshold on both
            -- branches -- not just a cosmetic match for every OTHER score
            -- line in this pipeline (HIGH THREAT SCORE/Final score/Low
            -- threat/Clean request all already show "N/80") -- a bare
            -- "Score: 45" gives a dashboard reader no way to tell how close
            -- that was to actually being diverted without cross-referencing
            -- a different log line entirely.
            if routing_decision.target == "honeypot" then
                ngx.log(ngx.WARN, "[FINAL DECISION] 🍯 ROUTING TO HONEYPOT | Score: ", threat_result.score,
                       "/", _G.config.threat.honeypot_threshold,
                       " | Reason: ", routing_decision.session_data.honeypot_reason or "unknown")
            else
                ngx.log(ngx.INFO, "[FINAL DECISION] ✅ ROUTING TO PRODUCTION | Score: ", threat_result.score,
                       "/", _G.config.threat.honeypot_threshold)
            end

            -- Apply botnet/scanner slowdown (tarpit) BEFORE returning.
            -- This wastes attacker compute time without raising suspicion:
            -- real servers occasionally respond slowly under load.
            -- No-op for whitelisted IPs and production-bound clean requests.
            router.apply_botnet_slowdown(session_data, threat_result)

            -- Sophistication classification: distinguishes scripted/automated,
            -- manual, and AI-assisted attacker behaviour (see
            -- sophistication_analyzer.lua for the full signal breakdown).
            -- Pure computation, no I/O, so it runs on every non-static
            -- request; the result is only persisted to the session -- and
            -- thus only visible in ELK -- for traffic that is already
            -- suspicious or honeypot-bound, to avoid extra Redis writes on
            -- uninteresting clean traffic.
            local sophistication_analyzer = require "sophistication_analyzer"
            local profile_subject = session_data or routing_decision.session_data
            local sophistication = sophistication_analyzer.classify_session(
                profile_subject, threat_result, request_headers)

            if sophistication.classification ~= "unknown" and
               (threat_result.suspicious or routing_decision.target == "honeypot") then
                routing_decision.update_session = true
                routing_decision.session_data = routing_decision.session_data or {}
                routing_decision.session_data.attacker_profile = {
                    classification = sophistication.classification,
                    confidence = sophistication.confidence,
                    scores = sophistication.scores,
                    signals = sophistication.signals,
                    updated = ngx.time()
                }
                routing_decision.session_data.timing_samples = sophistication.timing_samples

                ngx.log(ngx.WARN, "[SOPHISTICATION] Classified as ", sophistication.classification,
                        " (confidence=", sophistication.confidence, ") | IP: ", ngx.var.remote_addr,
                        " | Signals: ", table.concat(sophistication.signals, ", "))

                _G.utils.log_security_event("attacker_sophistication_classified", {
                    ip = ngx.var.remote_addr,
                    session_id = ngx.ctx.session_id,
                    classification = sophistication.classification,
                    confidence = sophistication.confidence,
                    scores = sophistication.scores,
                    signals = sophistication.signals
                })
            end

            -- Update session if needed
            -- Use the session_id from ngx.ctx to ensure consistency
            if routing_decision.update_session then
                session_handler.update_session(ngx.ctx.session_id, routing_decision.session_data)
            end

            ngx.log(ngx.INFO, "========================================")
            ngx.log(ngx.INFO, "")
        }

        # Default location for all other requests
        location / {
            header_filter_by_lua_block {
                -- ngx.INFO, not ngx.ERR: this fires on literally EVERY
                -- request through this location (successful ones
                -- included -- it's not conditioned on anything going
                -- wrong), so logging it at error severity mislabeled
                -- routine, correctly-working routing decisions as
                -- failures. Matches the sibling server-level
                -- header_filter_by_lua_block's own [HEADER_FILTER]
                -- version of this exact same message above, which
                -- already correctly uses ngx.INFO -- these two blocks
                -- log near-identical information (see §7's "two
                -- near-identical header_filter_by_lua_blocks" note) and
                -- had just drifted to different severities, not a
                -- deliberate distinction.
                ngx.log(ngx.INFO, "[LOCATION / HEADER] route_decision='", ngx.var.route_decision or "nil", "' threat_score='", ngx.var.threat_score or "nil", "'")
                -- Gated behind a shared secret -- see the matching comment on
                -- the server-level header_filter_by_lua_block above, and
                -- BLIND_PENTEST_PROTOCOL.md §8.2.
                local location_secret = _G.config.internal_test_secret
                if ngx.var.is_static_asset ~= "1" and
                   location_secret and location_secret ~= "" and
                   ngx.var.http_x_internal_test_auth == location_secret then
                    ngx.header["X-Route-Target"] = ngx.var.route_decision
                    ngx.header["X-Threat-Score"] = ngx.var.threat_score
                    ngx.log(ngx.INFO, "[LOCATION / HEADER] Set X-Route-Target=", ngx.var.route_decision or "nil")
                end
                
                if ngx.var.new_session_id and ngx.var.new_session_id ~= "" then
                    local cookie_value = ngx.var.new_session_id .. "; Path=/; HttpOnly; SameSite=Lax; Secure"
                    ngx.header["Set-Cookie"] = _G.config.session.cookie_name .. "=" .. cookie_value
                    ngx.log(ngx.INFO, "[SESSION] Setting session cookie in header_filter: ", ngx.var.new_session_id)
                end

                ngx.header["X-Powered-By"]   = nil
                ngx.header["X-Generator"]    = nil
                ngx.header["X-Pingback"]     = nil
                ngx.header["WooCommerce"]    = nil
            }

            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------------------------
        # Internal threat-state reset -- gated behind the SAME shared secret
        # (X-Internal-Test-Auth) as the X-Route-Target/X-Threat-Score debug
        # headers above. Flushes the in-process lua_shared_dict zones where a
        # host IP's threat reputation actually accumulates (threat_intel holds
        # threat_ips; sessions holds per-session sticky honeypot bindings;
        # rate_limit holds the per-IP request-rate windows).
        #
        # Why this exists: confirmed live that clearing Redis alone does NOT
        # reset a poisoned score -- admin/CVE detections write threat_ips into
        # the threat_intel shared dict directly (no Redis, no TTL -- see
        # threat_analyzer.check_ip_reputation / init_worker.lua), so the only
        # way to clear it used to be a full `docker compose restart
        # reverse_proxy` (nginx shared dicts live in the master process and
        # survive a reload, only a fresh master starts them empty). That
        # restart can take over a minute (keepalive_timeout drain), which made
        # "reset before each test scenario" impractical to repeat per-exploit
        # for the dashboard's PDF report export. flush_all() on the shared
        # dicts does the same job in-process, instantly, with no restart.
        #
        # Strictly a testing/admin affordance: unreachable unless
        # INTERNAL_TEST_SECRET is set AND presented, exactly like the debug
        # headers. A real external client never has the secret; a genuine
        # attacker's own reputation is per-IP and this only ever runs when the
        # operator explicitly resets between their own local test scenarios.
        location = /internal-threat-reset {
            access_log off;
            content_by_lua_block {
                local secret = _G.config.internal_test_secret
                if not secret or secret == "" or
                   ngx.var.http_x_internal_test_auth ~= secret then
                    ngx.status = 403
                    ngx.say("forbidden")
                    return
                end
                for _, name in ipairs({ "threat_intel", "sessions", "rate_limit" }) do
                    local dict = ngx.shared[name]
                    if dict then
                        dict:flush_all()
                        -- flush_all() only marks entries expired; flush_expired
                        -- actually reclaims them so a subsequent read is a real miss.
                        dict:flush_expired()
                    end
                end
                ngx.log(ngx.WARN, "[TEST] Threat-state shared dicts flushed via /internal-threat-reset")
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"reset":true,"flushed":["threat_intel","sessions","rate_limit"]}')
            }
        }

        # Reputation-only reset (test-gated, same secret): flushes JUST the
        # threat_intel shared dict -- the IP-reputation store that
        # threat_analyzer.check_ip_reputation() reads -- WITHOUT touching
        # sessions/rate_limit. The exploit report's threat-decay scenario calls
        # this before each benign probe so the host IP's Suricata-fed reputation
        # (continuously re-imported from the alert log) can't get re-added to
        # every probe's score and mask the session score's decay. Sessions are
        # left intact so the seeded, decaying score survives.
        location = /internal-threat-reset-reputation {
            access_log off;
            content_by_lua_block {
                local secret = _G.config.internal_test_secret
                if not secret or secret == "" or
                   ngx.var.http_x_internal_test_auth ~= secret then
                    ngx.status = 403
                    ngx.say("forbidden")
                    return
                end
                local dict = ngx.shared["threat_intel"]
                if dict then
                    dict:flush_all()
                    dict:flush_expired()
                end
                ngx.log(ngx.WARN, "[TEST] IP-reputation (threat_intel) flushed via /internal-threat-reset-reputation")
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"reset":true,"flushed":["threat_intel"]}')
            }
        }
    }
}
