name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      # The repo carries full WordPress trees; skip their blobs.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # nginx.conf files: test_no_tarpit.lua checks they never hold requests.
          sparse-checkout: |
            ids/reverse_proxy_enhanced/lua
            ids/reverse_proxy_enhanced/nginx.conf
            ids/db_proxy/reverse_proxy_enhanced/nginx.conf
      - name: Install Lua 5.1 (OpenResty's LuaJIT is 5.1-compatible)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run suites
        run: ids/reverse_proxy_enhanced/lua/tests/run_all.sh lua5.1

  dashboard:
    name: Dashboard core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dashboard
            ids/.env.example
            ids/docker-compose.yml
            ids/docker-compose.db-proxy.yml
            ids/db_proxy
            ids/reverse_proxy_enhanced/nginx.conf
            ids/reverse_proxy_enhanced/proxy_params
            ids/reverse_proxy_enhanced/lua/health_check.lua
            ids/reverse_proxy_enhanced/lua/init_worker.lua
            ids/scripts/replicate_content_to_honeypot.sh
            ids/eshop_seed/catalog.json
            ids/honeypot_database_migrations/01_clean-honeypot-data.sql
            ids/production_eshop_files/wp-content/db.php
            ids/production_eshop_files/wp-content/mu-plugins/honeypot-db-backend-header.php
            siem/docker/.env.example
            siem/kibana
            siem/vector/vector.yaml
            siem/vector/tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Qt-free core modules only; stdlib unittest, no PyQt6 install needed.
      - name: Run tests
        working-directory: dashboard
        run: python -m unittest discover -s tests -v

  vector:
    name: Vector enrich unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            siem/vector/vector.yaml
            siem/vector/tests
            siem/docker/.env.example
          sparse-checkout-cone-mode: false
      # Same Vector release the SIEM stack runs (siem/docker/.env.example).
      - name: Run vector test
        run: |
          VECTOR_VERSION=$(sed -n 's/^VECTOR_VERSION=//p' siem/docker/.env.example) \
            siem/vector/tests/run.sh
